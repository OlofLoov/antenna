<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
:root { --bg: #0B0F14; --text: #F5F7FA; --muted: #9AA4B2; --link: #5BB8FF; }
@media (prefers-color-scheme: light) {
  :root { --bg: #FFFFFF; --text: #0B0F14; --muted: #5A6472; --link: #0066CC; }
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 48px 24px; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, system-ui, sans-serif; }
main { max-width: 40em; margin: 0 auto; overflow-wrap: break-word; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
p { margin: 0 0 16px; color: var(--muted); }
a { color: var(--link); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>There is no page at this address.</p>
<p><a href="/">Go to the home page</a></p>
</main>
</body>
</html>
