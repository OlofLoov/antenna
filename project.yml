name: Antenna
options:
  bundleIdPrefix: se.codecrave
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  AntennaCore:
    path: Packages/AntennaCore
  AntennaDemux:
    path: Packages/AntennaDemux
  SnapshotPreviews:
    url: https://github.com/EmergeTools/SnapshotPreviews
    from: 0.20.0

targets:
  # iPhone, iPad and native Mac from one target (multiplatform destinations).
  Antenna:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Apps/Shared
      - Apps/Mobile
    dependencies:
      - package: AntennaCore
      - package: AntennaDemux
    entitlements:
      path: Config/Antenna.entitlements
    info:
      path: Apps/Mobile/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Antenna connects to TV servers on your home network when one of your sources points there."
        NSAppTransportSecurity:
          # IPTV sources are overwhelmingly plain http. Tighten per-domain later if you can.
          NSAllowsArbitraryLoads: true
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleDocumentTypes:
          - CFBundleTypeName: Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.m3u-playlist]
        AntennaTermsURL: https://codecrave.se/antenna/terms
        AntennaPrivacyURL: https://codecrave.se/antenna/privacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.codecrave.antenna
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  AntennaTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Apps/Tests
      - path: Config/Antenna.storekit
        buildPhase: resources
    dependencies:
      - target: Antenna
      - package: AntennaCore
        product: AntennaTestSupport
      - package: SnapshotPreviews
        product: SnapshottingTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AntennaUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - Apps/UITests
    dependencies:
      - target: Antenna
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AntennaJourneys:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - Apps/Journeys
    dependencies:
      - target: Antenna
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AntennaTV:
    type: application
    platform: tvOS
    sources:
      - Apps/Shared
      - Apps/TV
    dependencies:
      - package: AntennaCore
      - package: AntennaDemux
    entitlements:
      path: Config/AntennaTV.entitlements
    info:
      path: Apps/TV/Info.plist
      properties:
        CFBundleDisplayName: Antenna
        UIUserInterfaceStyle: Automatic
        AntennaTermsURL: https://codecrave.se/antenna/terms
        AntennaPrivacyURL: https://codecrave.se/antenna/privacy
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Antenna connects to TV servers on your home network when one of your sources points there."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.codecrave.antenna.tv
        TARGETED_DEVICE_FAMILY: "3"

  AntennaTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Apps/TVTests
      - path: Config/Antenna.storekit
        buildPhase: resources
    dependencies:
      - target: AntennaTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AntennaTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - Apps/TVUITests
    dependencies:
      - target: AntennaTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AntennaTVJourneys:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - Apps/TVJourneys
      - Apps/Journeys/Snap.swift
    dependencies:
      - target: AntennaTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Antenna:
    build:
      targets: { Antenna: all, AntennaTests: [test], AntennaUITests: [test], AntennaJourneys: [test] }
    run: { config: Debug, storeKitConfiguration: Config/Antenna.storekit }
    test:
      targets: [AntennaTests, AntennaUITests, AntennaJourneys]
  AntennaTV:
    build:
      targets: { AntennaTV: all, AntennaTVTests: [test], AntennaTVUITests: [test], AntennaTVJourneys: [test] }
    run: { config: Debug, storeKitConfiguration: Config/Antenna.storekit }
    test:
      targets: [AntennaTVTests, AntennaTVUITests, AntennaTVJourneys]
