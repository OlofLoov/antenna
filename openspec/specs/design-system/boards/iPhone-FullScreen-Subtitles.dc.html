<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone live TV, full screen with subtitles on</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #1A2535; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">
  <!-- browse.player fills the screen (live-tv-on-iphone-ipad-mac). add-subtitle-preferences adds player.subtitles after player.tracks and draws the subtitle cue. -->

  <!-- player.subtitles.cue: text cues centered near the bottom of the picture's rect, white semibold on a 0.6 black backdrop, 4 percent of the picture height with the caption floor as minimum. Raised above the controls while they show. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 74px; display: flex; justify-content: center">
    <span style="font-size: 17px; font-weight: 600; line-height: 1.3; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,0.6); color: #FFFFFF; text-align: center; max-width: 80%">I didn't see you yesterday.</span>
  </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 48px 14px; display: flex; align-items: center; gap: 12px; background: rgba(8,10,14,0.72)">
      <button type="button" aria-label="Pause" style="font: inherit; width: 32px; height: 32px; border-radius: 16px; border: 0; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <div style="flex: 1 1 auto; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.2)"><div style="height: 3px; width: 78%; border-radius: 2px; background: {{accent}}"></div></div>
      <span style="font-size: 13px; color: #D7DEE8; font-variant-numeric: tabular-nums">21:34</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 3px 7px; border-radius: 5px; background: rgba(255,255,255,0.14)"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FF5F57; display: inline-block"></span>LIVE</span>
      <!-- player.tracks: text.bubble -->
      <button type="button" aria-label="Audio and subtitles" style="font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
      </button>
      <!-- player.subtitles, on: captions.bubble.fill, accessibility value "On" -->
      <button type="button" aria-label="Subtitles" aria-pressed="true" style="font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="3" fill="currentColor"/><path d="M10.5 10a2 2 0 1 0 0 3M16.5 10a2 2 0 1 0 0 3" fill="none" stroke="#0B0E13" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <!-- player.airplay: full screen at compact width, while the engine route is .system -->
      <button type="button" aria-label="AirPlay" style="font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="M12 15l5 6H7z"/></svg>
      </button>
      <button type="button" aria-label="Picture in picture" style="font: inherit; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>
      </button>
      <button type="button" aria-label="Exit full screen" style="font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
