<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV offer from iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- play-on-apple-tv/the-tv-offers-a-waiting-request: a request sent through iCloud while Antuna was closed on this Apple TV. The offer shows once Antuna opens and any "Who's watching?" choice is made, over whatever the first screen is (drawn over the Movies tab), in the same panel as TV-Reminder-Banner. Play has focus on appearance; Menu acts as Not now. It stays until the viewer chooses, since the viewer may still be sitting down. A request that arrives over the home network plays at once and shows only the small "From Anna's iPhone" banner (not drawn yet, see design.md). -->
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- The screen behind: Movies, dimmed by the scrim under the panel. Content in the 80 pt safe area (design-system/apple-tv-content-stays-in-the-safe-area). -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #2A3546 0%, #141A24 55%, #0B0E13 100%)"></div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 60px; display: flex; gap: 40px">
    <div style="width: 260px; height: 390px; border-radius: 12px; background: #3A2F4A"></div>
    <div style="width: 260px; height: 390px; border-radius: 12px; background: #2F4A3A"></div>
    <div style="width: 260px; height: 390px; border-radius: 12px; background: #4A3A2F"></div>
    <div style="width: 260px; height: 390px; border-radius: 12px; background: #2F3A4A"></div>
    <div style="width: 260px; height: 390px; border-radius: 12px; background: #4A2F3A"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

  <!-- playOn.offer: centered panel, 760 pt wide. The title's poster, or the channel's logo tile for a channel. Eyebrow names the sending device; title and one facts line. For a film with a saved place the facts line ends "Resumes at 40 min". -->
  <div role="dialog" aria-label="From Anna's iPhone" style="position: absolute; left: 580px; top: 300px; width: 760px; box-sizing: border-box; padding: 36px; border-radius: 20px; background: rgba(8,10,14,0.92); box-shadow: 0 12px 32px rgba(0,0,0,0.45); display: flex; gap: 32px">
    <!-- playOn.offer.art -->
    <div style="width: 160px; height: 240px; border-radius: 12px; background: #4A3A2F; flex: 0 0 auto"></div>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #A7B0BF">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <!-- playOn.offer.sender -->
        <span>From Anna's iPhone</span>
      </div>
      <!-- playOn.offer.title -->
      <div style="font-size: 48px; font-weight: 700; line-height: 1.1; font-family: ui-rounded, -apple-system, system-ui, 'Helvetica Neue', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Salt Road</div>
      <!-- playOn.offer.facts -->
      <div style="font-size: 25px; color: #D7DEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Movie · 1 h 32 min · Resumes at 40 min</div>
      <div style="flex: 1 1 auto"></div>
      <div style="display: flex; gap: 20px">
        <!-- playOn.offer.play, focused on appearance (design-system/focus-is-the-lifted-white-card) -->
        <button type="button" style="font: inherit; font-size: 29px; font-weight: 600; height: 76px; padding: 0 40px; border-radius: 12px; border: 0; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,0.45); transform: scale(1.05); display: flex; align-items: center; gap: 12px; cursor: pointer">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span>Play</span>
        </button>
        <!-- playOn.offer.notNow -->
        <button type="button" style="font: inherit; font-size: 29px; font-weight: 600; height: 76px; padding: 0 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.12); color: #F2F4F8; cursor: pointer">Not now</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
