<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV movies, expanded card while details load</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- The highlight has just moved onto Quiet Engines, or rests there and the provider has not answered. The card has grown at
       once with what the row knows: the category, the name and the poster, whole at the trailing side over a blurred copy of
       itself. No facts or plot yet. After 0.8 s on the card the provider is asked; when it answers, the facts and plot fade in
       under the name and the backdrop fades in over the poster. A poster passed in less than 0.8 s is never asked about. -->

  <!-- shell.tabBar: tvOS tab bar, owned by tvos-shell -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between">
    <!-- shell.mark: not focusable -->
    <div style="display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; width: 260px">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
      <span>Antuna</span>
    </div>
    <!-- the pill group sits on the screen's horizontal center; the profile and Settings buttons hang 14 to its right (tvos-shell/the-tab-bar-sits-in-the-same-place-on-every-tab) -->
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%)">
      <!-- shell.tab.live, shell.tab.guide, shell.tab.movies, shell.tab.series, shell.tab.search -->
      <div style="display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.08)">
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Live</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Guide</span>
        <span style="font-size: 26px; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #F2F4F8">Movies</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Series</span>
        <span aria-label="Search" style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8; display: inline-flex; align-items: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      </div>
      <div style="position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 14px; display: flex; align-items: center; gap: 14px">
      <!-- shell.settings: 30 pt gear, opens the Settings sheet, not a tab -->
      <span aria-label="Settings" style="width: 56px; height: 56px; border-radius: 28px; color: #F2F4F8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </span>
      </div>
    </div>
  </div>

  <!-- The focused row (movies.row.<categoryName slug>) rests with its header at y 140, 36 pt under the tab bar, and its cards from
       184 to 502. Two more rows follow at the same 40 pt spacing: Drama from y 542 and Comedy from 944, cut by the screen's foot.
       Rows above the focused one have scrolled up under the tab bar, which sits on a band of the ground color. -->
  <!-- Same card geometry as TV-Movies-Expanded. The copy stops 24 pt short of the whole poster: 330 pt wide. -->
  <div style="position: absolute; left: 0; right: 0; top: 140px; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 80px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 28px; font-weight: 700">Thriller</div>
      <div style="font-size: 20px; color: #A7B0BF">187 titles</div>
    </div>
    <div style="display: flex; gap: 20px; padding: 0 80px; overflow: hidden">
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A3A2F; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 566px; height: 318px; border-radius: 12px; flex: 0 0 auto; position: relative; overflow: hidden; box-shadow: 0 0 0 5px #F2F4F8, 0 16px 40px rgba(0,0,0,0.55)">
        <div style="position: absolute; inset: 0; background: #4A2F3A; filter: blur(24px); transform: scale(1.2)"></div>
        <div style="position: absolute; inset: 0; background: rgba(11,14,19,0.35)"></div>
        <div style="position: absolute; right: 24px; bottom: 24px; width: 148px; height: 222px; border-radius: 8px; background: #4A2F3A"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,19,0) 30%, rgba(11,14,19,0.6) 60%, rgba(11,14,19,0.92) 100%)"></div>
        <div style="position: absolute; left: 24px; bottom: 20px; width: 330px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #A7B0BF">Thriller</div>
          <div style="font-size: 34px; font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-rounded, -apple-system, system-ui, 'Helvetica Neue', sans-serif">Quiet Engines</div>
        </div>
      </div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3A4A2F; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3B2F4A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F4A3B; flex: 0 0 auto"></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 542px; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 80px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 28px; font-weight: 700">Drama</div>
      <div style="font-size: 20px; color: #A7B0BF">143 titles</div>
    </div>
    <div style="display: flex; gap: 20px; padding: 0 80px; overflow: hidden">
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3A4A2F; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3B2F4A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F4A3B; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #334155; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A3A2F; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
    </div>
  </div>

  <!-- Posters still loading (movies.card.<id>, the same button): a quiet shape in Surface 0.06 at the poster's size and
       corner, with no name and no spinner. The picture fades in over it in 0.2 s when it lands; under Reduce Motion it
       appears at once. A poster already in memory draws in its first frame with no fade. A title with no poster, or one
       that failed, shows its name on the #26344A tile instead. Comedy has just come into view at the foot, so its
       posters are still on their way; the last poster of Drama too. iPhone, iPad and Mac draw the same shape at their
       poster sizes. -->
  <div style="position: absolute; left: 0; right: 0; top: 944px; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 80px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 28px; font-weight: 700">Comedy</div>
      <div style="font-size: 20px; color: #A7B0BF">121 titles</div>
    </div>
    <div style="display: flex; gap: 20px; padding: 0 80px; overflow: hidden">
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3A4A2F; flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: rgba(255,255,255,0.06); flex: 0 0 auto"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
