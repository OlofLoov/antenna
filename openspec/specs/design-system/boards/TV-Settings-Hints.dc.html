<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV settings, remote hints</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- TV-Settings-Preferences with Show remote hints focused and the remote hints legend showing, as on arriving at Settings. Each preference is a row with its label and value; selecting it opens TV-Settings-Preferences-Choices. -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <div style="position: absolute; left: 80px; right: 80px; top: 60px; bottom: 60px; display: flex; gap: 80px">

    <!-- settings.lead -->
    <div style="width: 560px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; text-align: center">
      <div style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 150px; line-height: 1; color: #A7B0BF">⚙</div>
      <div style="font-size: 48px; font-weight: 600">Sources &amp; Settings</div>
      <!-- No lead footer: Show remote hints has none. -->
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; font-size: 29px">
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">PREFERENCES</div>
      <!-- settings.openOnLaunch -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Open on launch</span><span style="color: #A7B0BF">Live ›</span></div>
      <!-- settings.guideWindow -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Guide window</span><span style="color: #A7B0BF">2 hours ›</span></div>
      <!-- settings.refreshSources -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Refresh sources</span><span style="color: #A7B0BF">Every 12 hours ›</span></div>
      <!-- settings.swipe -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Swipe up or down while watching</span><span style="color: #A7B0BF">Changes channel ›</span></div>
      <!-- settings.subtitles -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Subtitles</span><span style="color: #A7B0BF">Auto ›</span></div>
      <!-- settings.autoplayNext: system Toggle, On or Off, kept on this device only; its footer shows in the lead column while focused (up-next/turn-autoplay-off) -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Autoplay next episode</span><span style="color: #A7B0BF">On</span></div>
      <!-- settings.remoteHints: system Toggle, On or Off, kept on this device only (control-hints/turn-remote-hints-off). Focused, value dark secondary on the platter. -->
      <div style="height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #F2F4F8; color: #0B0E13; border-radius: 20px; transform: scale(1.03); box-shadow: 0 12px 32px rgba(0,0,0,.45)"><span>Show remote hints</span><span style="color: #4B5563">On</span></div>
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">ABOUT</div>
      <!-- settings.version -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Version</span><span style="color: #A7B0BF">1.0 (4)</span></div>
      <!-- settings.ffmpegNotice -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>FFmpeg</span><span style="color: #A7B0BF">›</span></div>
    </div>
  </div>
  <!-- hints.legend: caption (25 pt), scrimTint 0.82, large corner (20), padding 24, top right inside the safe area, 124 from the top under the clock row and 80 from the right, the same on every screen. Never focusable; VoiceOver reads it as one sentence. Shows on arriving at a screen, fades after 6 s. -->
  <div style="position: absolute; right: 80px; top: 124px; padding: 24px; border-radius: 20px; background: rgba(8, 10, 14, 0.82); font-size: 25px; color: #F2F4F8; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 600; color: #A7B0BF"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="20" rx="4"/><circle cx="12" cy="7" r="2.4"/><circle cx="12" cy="13" r="0.8"/><circle cx="12" cy="16.5" r="0.8"/></svg><span>Remote</span></div>
    <div style="display: grid; grid-template-columns: auto auto auto; column-gap: 12px; row-gap: 8px; align-items: center">
      <span style="display: flex; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span><span style="font-weight: 600">Click</span><span style="color: #A7B0BF">Open or change</span>
      <span style="display: flex; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span><span style="font-weight: 600">Back</span><span style="color: #A7B0BF">Back or close</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
