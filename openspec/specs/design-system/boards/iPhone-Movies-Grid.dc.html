<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone movies, grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- clean-up-glass: controls over the art or the picture are glass alone, with no scrim fill, stroke or shadow of their own. -->
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- movies.grid on iPhone: a genre chip is selected (movies-and-series-browsing/browse-a-genre-or-sort-the-lot). The hero and chips stay as on iPhone-Movies.dc.html; the grid replaces the rows below. My list (chip) and Continue watching "See all" show the same grid; Continue watching uses the 168 by 94 cards -->

  <!-- Hero: unchanged from iPhone-Movies.dc.html -->
  <div style="position: relative; width: 390px; height: 520px; background: #22304A; flex: 0 0 auto; overflow: hidden">
    <!-- top bar over the art: the section's name (movies.title, a large bold title; Series shows "Series") and the profile button (profile.button: the current profile's color and initial in a 32 pt circle, or a person glyph with one profile; plain, no glass). No Movies | Series switch and no search button: Series and Search are in the tab bar (live-tv-on-iphone-ipad-mac/the-iphone-tab-bar). -->
    <div style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px; font-family: ui-rounded, -apple-system, system-ui, 'Helvetica Neue', sans-serif" role="heading" aria-level="1">Movies</div>
      <div role="button" aria-label="Profile, Kids" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #C084FC; color: #0B0E13; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">K</span>
      </div>
    </div>
    <!-- movies.genres (movies-and-series-browsing/pick-a-genre-from-a-list-on-iphone): the open list's name in its own text run, its count and a chevron, as Live's group button (browse.groups), plain with no fill over the art. Tapping it opens the Genres sheet (iPhone-Movies-Genres.dc.html). No genre chips at the top. -->
    <div role="button" aria-label="Thriller, 187 titles" style="position: absolute; left: 0; right: 0; top: 104px; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; color: #F2F4F8"><bdi style="font-size: 16px; font-weight: 600; white-space: nowrap">Thriller</bdi><span style="font-size: 15px; color: #D7DEE8; font-variant-numeric: tabular-nums">· 187</span><span style="color: #D7DEE8; display: inline-flex"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
    <!-- copy -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 74px 16px 16px; background: linear-gradient(to bottom, rgba(11,14,19,0) 0, rgba(11,14,19,0.78) 56px, rgba(11,14,19,0.86) 100%); display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: {{accent}}">Recently added · Thriller</div>
      <div style="font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px; font-family: ui-rounded, -apple-system, system-ui, 'Helvetica Neue', sans-serif">The Long Harbor</div>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #D7DEE8">
        <span>2024</span><span style="width: 3px; height: 3px; border-radius: 2px; background: #A7B0BF; display: inline-block"></span><span>2 h 08 min</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 4px; border: 1.5px solid #A7B0BF">4K</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 4px; border: 1.5px solid #A7B0BF">15</span>
      </div>
      <div style="display: flex; gap: 8px; padding-top: 6px">
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 700; height: 44px; flex: 1 1 auto; border-radius: 10px; border: 0; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span>Play</span>
        </button>
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.14); color: #F2F4F8; cursor: pointer">Info</button>
      </div>
      <!-- Second row: Trailer when there is one, then My list in words, so every label fits in German too -->
      <div style="display: flex; gap: 8px">
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.14); color: #F2F4F8; white-space: nowrap; cursor: pointer">Add to My list</button>
      </div>
    </div>
  </div>

  <!-- movies.grid: header is the list name and "<n> titles" in the row header type; posters at the row card size (110 by 165), three per row, 10 gap, 12 between rows. The second row is cut by the tab bar -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; flex: 1 1 auto; min-height: 0; overflow: hidden">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Thriller</div>
      <div style="font-size: 13px; color: #A7B0BF">187 titles</div>
    </div>
    <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(3, 110px); column-gap: 10px; row-gap: 12px">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2A3A52"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3B2F4A"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A3A2F"></div>

      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F4A3B"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #334155"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A2F3A"></div>
    </div>
  </div>

  <!-- Tab bar (live-tv-on-iphone-ipad-mac/the-iphone-tab-bar): Live, Guide, Movies and Series in the system bar, the open tab in the accent, and Search as the system's round search button at the trailing end. No Settings tab: Settings opens from the profile button (profile.button). -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; gap: 10px; align-items: center; width: 100%">
    <div role="tablist" style="flex: 1 1 auto; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center">
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
        <span>Live</span>
      </div>
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
        <span>Guide</span>
      </div>
      <div role="tab" aria-selected="true" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
        <span>Movies</span>
      </div>
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="15" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v9"/><path d="M9 10.5v5l4-2.5z" fill="currentColor"/></svg>
        <span>Series</span>
      </div>
    </div>
    <div role="button" aria-label="Search" aria-pressed="false" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); color: #F2F4F8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
