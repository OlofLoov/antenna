<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">
  <!-- Edit a profile: name, color, Save, Delete profile (absent for the last profile). Name 1 to 30 characters after trimming. -->
  <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 48px">
    <div style="width: 200px; height: 200px; border-radius: 100px; background: #A3E635; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 88px; font-weight: 700">K</div>
    <!-- profiles.edit.name: system text field; the keyboard opens on select -->
    <div style="display: flex; flex-direction: column; gap: 12px; width: 760px">
      <div style="font-size: 22px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #A7B0BF">Name</div>
      <div style="height: 80px; border-radius: 12px; background: rgba(255,255,255,0.12); display: flex; align-items: center; padding: 0 28px; font-size: 34px">Kids</div>
    </div>
    <div style="display: flex; gap: 28px">
      <!-- profiles.edit.color.0 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #5BB8FF; box-sizing: border-box;  "></div>
      <!-- profiles.edit.color.1 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #FFB454; box-sizing: border-box;  "></div>
      <!-- profiles.edit.color.2 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #4FD1C5; box-sizing: border-box;  "></div>
      <!-- profiles.edit.color.3 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #C084FC; box-sizing: border-box;  "></div>
      <!-- profiles.edit.color.4 (focused) -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #F87171; box-sizing: border-box;  transform: scale(1.12); box-shadow: 0 12px 32px rgba(0,0,0,0.45);"></div>
      <!-- profiles.edit.color.5 (selected) -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #A3E635; box-sizing: border-box; border: 5px solid #F2F4F8; "></div>
      <!-- profiles.edit.color.6 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #F472B6; box-sizing: border-box;  "></div>
      <!-- profiles.edit.color.7 -->
      <div style="width: 72px; height: 72px; border-radius: 36px; background: #94A3B8; box-sizing: border-box;  "></div>
    </div>
    <div style="display: flex; gap: 24px">
      <!-- profiles.edit.save -->
      <span style="font-size: 26px; font-weight: 600; padding: 16px 40px; border-radius: 12px; background: rgba(255,255,255,0.12)">Save</span>
      <!-- profiles.edit.delete: asks first ("Delete Kids?" / "Its favorites, hidden groups and history go too. Sources stay.") -->
      <span style="font-size: 26px; font-weight: 600; padding: 16px 40px; border-radius: 12px; background: rgba(255,255,255,0.12); color: #FF6B6B">Delete profile</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
