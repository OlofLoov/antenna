<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV channel overlay, Favorites empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #141C27; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- Live video stage (full bleed, keeps playing under the overlay) -->
  <div style="position: absolute; inset: 0; background: #1A2535"></div>
  <div style="position: absolute; right: 64px; bottom: 44px; display: flex; align-items: center; gap: 14px; font-size: 24px; color: #A7B0BF">
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57; display: inline-block"></span>
    <span>Live · Sport One · 1080p</span>
  </div>

  <!-- Clock -->
  <div style="position: absolute; right: 64px; top: 44px; font-size: 34px; font-weight: 600; letter-spacing: 0.5px">21:34</div>

  <!-- Overlay: groups | channels | now & next -->
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 1600px; background: rgba(8, 10, 14, 0.88); display: flex">

    <!-- Groups -->
    <div style="width: 320px; box-sizing: border-box; padding: 48px 20px 48px 40px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 20px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #A7B0BF; padding: 0 16px 18px">Groups</div>
      <!-- Group (focused) -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; font-weight: 600; color: #0B0E13; background: #F2F4F8; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
        <span style="display: flex; align-items: center; gap: 14px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span>Favorites</span></span>
        <span style="font-size: 22px; color: #4B5563; font-weight: 400">0</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>All channels</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">369</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Sport</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">42</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>News</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">36</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Movies</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">118</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Series</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">64</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Kids</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">27</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Documentary</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">51</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Music</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">19</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 29px; color: #F2F4F8">
        <span>Local</span>
        <span style="font-size: 22px; color: #A7B0BF; font-weight: 400">12</span>
      </div>
      <div style="flex: 1 1 auto"></div>
      <div style="display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px; border-radius: 12px; font-size: 26px; color: #A7B0BF">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Search</span>
      </div>
    </div>

    <!-- Channels in group -->
    <div style="width: 700px; box-sizing: border-box; padding: 48px 24px; border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 18px">
        <div style="font-size: 20px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #A7B0BF">Favorites</div>
        <div style="font-size: 20px; color: #A7B0BF">Your order</div>
      </div>

      <!-- overlay.emptyGroup -->
      <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 40px; text-align: center; font-size: 26px; line-height: 1.4; color: #A7B0BF">No favorites yet. Press the star on a channel to add it.</div>
    </div>

    <!-- Now & next: empty while the channel column is empty (AC-13) -->
    <div style="flex: 1 1 auto; box-sizing: border-box; padding: 48px 48px 48px 40px; border-left: 1px solid rgba(255,255,255,0.08)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
