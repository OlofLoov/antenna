<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac browse, player only</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 600px; height: 834px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex">
  <!-- 600 pt wide: sidebar and list behind browse.toggleSidebar and browse.toggleList, only the player with its panel (AC-1) -->
  <!-- Player + now/next -->
  <div style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Show sidebar" style="font: inherit; width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <button type="button" aria-label="Show channel list" style="font: inherit; width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <div style="width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #1A2535; position: relative; overflow: hidden">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; align-items: center; gap: 14px; background: rgba(8,10,14,0.72)">
        <button type="button" aria-label="Pause" style="font: inherit; width: 36px; height: 36px; border-radius: 18px; border: 0; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <div style="flex: 1 1 auto; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2)"><div style="height: 4px; width: 78%; border-radius: 2px; background: {{accent}}"></div></div>
        <span style="font-size: 13px; color: #D7DEE8; font-variant-numeric: tabular-nums">21:34</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 1px; padding: 4px 8px; border-radius: 5px; background: rgba(255,255,255,0.14)"><span style="width: 7px; height: 7px; border-radius: 4px; background: #FF5F57; display: inline-block"></span>LIVE</span>
        <button type="button" aria-label="Picture in picture" style="font: inherit; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>
        </button>
        <button type="button" aria-label="Full screen" style="font: inherit; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 16px">
      <div style="width: 84px; height: 56px; border-radius: 8px; background: #1E3A5F; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; letter-spacing: 1px; flex: 0 0 auto">S1</div>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <div style="font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Premier League: Arsenal v Liverpool</div>
          <div style="font-size: 14px; color: #A7B0BF; white-space: nowrap">20:00 – 22:00</div>
        </div>
        <div style="font-size: 15px; color: #A7B0BF">Sport One · 104 · 26 min left</div>
        <div style="font-size: 15px; line-height: 1.45; color: #D7DEE8">Second half from the Emirates. Commentary by the studio team, with analysis at full time.</div>
      </div>
      <button type="button" aria-label="Add to favorites" style="font: inherit; width: 40px; height: 40px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.1); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding-bottom: 8px">Up next on Sport One</div>
      <div style="display: flex; gap: 14px; align-items: baseline; height: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px"><span style="width: 52px; font-size: 14px; color: #A7B0BF; font-variant-numeric: tabular-nums">22:00</span><span style="font-size: 16px">Match of the Day</span></div>
      <div style="display: flex; gap: 14px; align-items: baseline; height: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px"><span style="width: 52px; font-size: 14px; color: #A7B0BF; font-variant-numeric: tabular-nums">23:15</span><span style="font-size: 16px">Sports Tonight</span></div>
      <div style="display: flex; gap: 14px; align-items: baseline; height: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px"><span style="width: 52px; font-size: 14px; color: #A7B0BF; font-variant-numeric: tabular-nums">00:00</span><span style="font-size: 16px; color: #D7DEE8">Replay: Premier League</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":600,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
