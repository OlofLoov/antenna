<body>
<x-dc>
<helmet>
<style>
body{margin:0}

</style>

<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex">
  <!-- Sidebar, the same as iPad.dc.html with Guide selected. Identifiers are 0010's (browse.sidebar, browse.section.*, browse.group.*). -->
  <div style="width: 232px; flex: 0 0 auto; box-sizing: border-box; padding: 24px 12px; background: #11151C; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 18px; font-size: 20px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg><span>Antenna</span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg><span>Live</span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; font-weight: 600; color: #F2F4F8; background: rgba(255,255,255,0.12)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg><span>Guide</span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg><span>Movies</span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>Series</span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 22px 12px 8px">Groups</div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; font-weight: 600; color: #F2F4F8; background: rgba(255,255,255,0.08)"><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>Favorites</span><span style="font-size: 14px; color: #A7B0BF">0</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>All channels</span><span style="font-size: 14px; color: #A7B0BF">412</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Sport</span><span style="font-size: 14px; color: #A7B0BF">42</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>News</span><span style="font-size: 14px; color: #A7B0BF">31</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Movies</span><span style="font-size: 14px; color: #A7B0BF">58</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Series</span><span style="font-size: 14px; color: #A7B0BF">24</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Kids</span><span style="font-size: 14px; color: #A7B0BF">19</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Documentary</span><span style="font-size: 14px; color: #A7B0BF">27</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>Music</span><span style="font-size: 14px; color: #A7B0BF">15</span></div>
    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #A7B0BF"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Sources &amp; Settings</span></div>
  </div>

  <!-- Guide column: guide.root -->
  <div style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <!-- guide.toolbar: filter, day chips (guide.days, guide.day.<index>), guide.now, guide.zoomOut, guide.zoomIn, guide.nowPlaying -->
    <div style="display: flex; align-items: center; gap: 12px; height: 44px; flex: 0 0 auto">
      <!-- guide.filter -->
      <label style="display: flex; align-items: center; gap: 8px; width: 160px; height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #A7B0BF; font-size: 15px; box-sizing: border-box; flex: 0 0 auto">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter channels</span>
        <input type="search" placeholder="Filter" value="" style="font: inherit; flex: 1 1 auto; min-width: 0; background: transparent; border: 0; color: #F2F4F8; outline: none">
      </label>
      <!-- guide.days, horizontally scrollable -->
      <div style="display: flex; gap: 6px; overflow: hidden; white-space: nowrap; flex: 0 1 auto"><span style="font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 16px; background: #F2F4F8; color: #0B0E13; flex: 0 0 auto">Today</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Wed</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Thu</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Fri</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Sat</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Sun</span><span style="font-size: 14px; padding: 7px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #F2F4F8; flex: 0 0 auto">Mon</span></div>
      <!-- guide.now -->
      <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.08); color: #F2F4F8; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex: 0 0 auto"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; display: inline-block"></span>Now</button>
      <!-- guide.zoomOut, guide.zoomIn -->
      <div style="display: inline-flex; border-radius: 10px; background: rgba(255,255,255,0.08); overflow: hidden; flex: 0 0 auto">
        <button type="button" aria-label="Zoom out" style="font: inherit; width: 34px; height: 32px; border: 0; background: transparent; color: #F2F4F8; font-size: 18px; cursor: pointer">−</button>
        <span style="width: 1px; background: rgba(255,255,255,0.1)"></span>
        <button type="button" aria-label="Zoom in" style="font: inherit; width: 34px; height: 32px; border: 0; background: transparent; color: #F2F4F8; font-size: 18px; cursor: pointer">+</button>
      </div>
      <!-- guide.nowPlaying: the channel 0010's player is playing; tap returns to Live. guide.nowPlaying.progress under the text. -->
      <div style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px 0 6px; border-radius: 10px; background: rgba(255,255,255,0.08); flex: 0 0 auto; margin-left: auto">
        <span style="width: 40px; height: 26px; border-radius: 5px; background: #1E3A5F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #F2F4F8">S1</span>
        <div style="display: flex; flex-direction: column; gap: 4px; width: 128px">
          <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FF5F57; display: inline-block; flex: 0 0 auto"></span><span style="overflow: hidden; text-overflow: ellipsis">104 Sport One</span></div>
          <div style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.16)"><div style="height: 3px; width: 78%; border-radius: 2px; background: {{accent}}"></div></div>
        </div>
      </div>
    </div>
    <!-- guide.grid: rows 56 pt, 4 pt gaps, scrolls both ways; the header and channel column stay pinned -->
    <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px">
    <!-- guide.header: group title cell (guide.groupTitle) then 30-minute columns of 180 pt -->
    <div style="display: flex; align-items: center; height: 36px; flex: 0 0 auto; position: relative">
      <div style="width: 200px; flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px; padding-right: 12px; box-sizing: border-box"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Favorites</span><span style="font-size: 13px; color: #A7B0BF">0</span></div>
      <div style="width: 180px; flex: 0 0 auto; font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12); box-sizing: border-box">21:00</div><div style="width: 180px; flex: 0 0 auto; font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12); box-sizing: border-box">21:30</div><div style="width: 180px; flex: 0 0 auto; font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12); box-sizing: border-box">22:00</div><div style="width: 180px; flex: 0 0 auto; font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12); box-sizing: border-box">22:30</div>
      <!-- guide.nowLine pill at the now line, 21:34 -->
      <div style="position: absolute; left: 380px; top: 6px; padding: 3px 7px; border-radius: 6px; background: {{accent}}; color: #0B0E13; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums">21:34</div>
    </div>

    <!-- guide.nowLine: 2 pt accent, 21:34 is 34 minutes past the 21:00 column start, 200 + 34/30 × 180 = 404 pt from the grid edge -->
    <div style="position: absolute; left: 404px; top: 30px; bottom: 0; width: 2px; background: {{accent}}; border-radius: 1px"></div>
    <!-- guide.empty, muted 15 pt centred in the grid area; the time header stays -->
    <div style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #A7B0BF">No channels in Favorites</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
