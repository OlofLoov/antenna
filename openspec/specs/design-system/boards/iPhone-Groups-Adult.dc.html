<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone groups, adult marking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- filter-adult-content: a provider group's settings with the Adult content switch, in a profile that shows adult content. The app found this group adult by its name, so the switch starts on. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="margin-top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <span style="font-size: 17px; color: #5BB8FF">‹ Groups</span>
    <span style="font-size: 17px; font-weight: 600">XXX Movies</span>
    <span style="width: 72px"></span>
  </div>
  <!-- groups.detail -->
  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Name</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- groups.name -->
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px; color: #6B7280">XXX Movies</div>
      <!-- groups.rename -->
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; font-size: 17px; color: #5BB8FF">Rename</div>
    </div>
    <div style="height: 10px"></div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- groups.hide -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span>Hidden</span>
        <span style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32); position: relative"><span style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></span>
      </div>
      <!-- groups.lock -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span>Locked</span>
        <span style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32); position: relative"><span style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></span>
      </div>
      <!-- groups.adult: a system Toggle, on. On shows what the app found or the user's mark; switching it stores the user's mark for every device. -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; font-size: 17px">
        <span>Adult content</span>
        <span style="width: 51px; height: 31px; border-radius: 16px; background: #34C759; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></span>
      </div>
    </div>
    <!-- groups.adult.footer: secondary -->
    <div style="font-size: 13px; line-height: 1.4; color: #A7B0BF; padding: 0 4px 8px">Adult groups stay hidden in every profile that does not show adult content.</div>
    <div style="height: 10px"></div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px; color: #5BB8FF">Move up</div>
      <div style="height: 48px; display: flex; align-items: center; padding: 0 14px; font-size: 17px; color: #5BB8FF">Move down</div>
    </div>
  </div>
  <!-- In a profile that hides adult content, this group is not on the Groups list. The list's footer (groups.adultHidden) reads "Adult groups are hidden in this profile. Show adult content in Settings to see and mark them." -->
</div>
</x-dc>
</body>
</html>
