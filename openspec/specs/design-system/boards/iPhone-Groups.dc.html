<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone groups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- Nav -->
  <div style="margin-top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <a href="#" style="display: inline-flex; align-items: center; gap: 4px; font-size: 17px; color: #5BB8FF; text-decoration: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Settings</span>
    </a>
    <span style="font-size: 17px; font-weight: 600">Groups</span>
    <span style="font-size: 17px; color: #5BB8FF; width: 72px; text-align: right">Edit</span>
  </div>

  <!-- groups.list -->
  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">9 groups</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- groups.row (All channels) -->
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">All channels</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">412</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">Sport</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">42</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">News</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">31</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <!-- groups.row.<groupKey>.locked -->
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">Movies</span>
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 2px 7px; border-radius: 5px; border: 1.5px solid #A7B0BF; color: #D7DEE8">
          <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          LOCKED
        </span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">58</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">Kids</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">19</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <!-- groups.row.<groupKey>.hidden -->
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px; color: #A7B0BF">
        <span style="flex: 1 1 auto">Adult</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 2px 7px; border-radius: 5px; border: 1.5px solid #A7B0BF; color: #A7B0BF">HIDDEN</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">36</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">Documentary</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">27</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <!-- groups.row.<groupKey>.custom -->
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px">
        <span style="flex: 1 1 auto">Weekend sports</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 2px 7px; border-radius: 5px; border: 1.5px solid #A7B0BF; color: #D7DEE8">CUSTOM</span>
        <span style="font-size: 13px; color: #A7B0BF; font-variant-numeric: tabular-nums">6</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B0BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <!-- groups.new -->
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; font-size: 17px; color: #A7B0BF">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New group</span>
      </div>
    </div>

    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 14px 4px 0">Search</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- groups.searchHidden -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; font-size: 16px">
        <span>Include hidden channels in search</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
      </div>
    </div>
  </div>

  <!-- Tab bar, Settings selected -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
