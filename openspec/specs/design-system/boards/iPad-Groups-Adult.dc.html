<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad and Mac groups, adult marking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- filter-adult-content: iPad-Groups with the list on the left and the editor on the right, in a profile that hides adult content. On a Mac it is the same split. -->
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex">
  <!-- groups.list -->
  <div style="width: 420px; border-right: 1px solid rgba(255,255,255,0.08); padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 28px; font-weight: 700; padding: 0 4px 8px">Groups</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px"><span>All channels</span><span style="color: #A7B0BF">376</span></div>
      <!-- selected row -->
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px; background: rgba(91,184,255,0.18)"><span>Late Night</span><span style="color: #A7B0BF">22</span></div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 17px"><span>Sport</span><span style="color: #A7B0BF">42</span></div>
    </div>
    <!-- groups.adultHidden: the list's footer while the profile hides adult groups, secondary -->
    <div style="font-size: 13px; line-height: 1.4; color: #A7B0BF; padding: 0 4px">Adult groups are hidden in this profile. Show adult content in Settings to see and mark them.</div>
  </div>
  <!-- groups.detail for Late Night, which the app did not find adult -->
  <div style="flex: 1 1 auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 22px; font-weight: 700; padding-bottom: 12px">Late Night</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px"><span>Hidden</span><span style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32)"></span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px"><span>Locked</span><span style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32)"></span></div>
      <!-- groups.adult: off. Switching it on leaves the group out of this profile's lists at once, and the editor goes back to the list. -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; font-size: 17px"><span>Adult content</span><span style="width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32)"></span></div>
    </div>
    <div style="font-size: 13px; line-height: 1.4; color: #A7B0BF; padding: 0 4px">Adult groups stay hidden in every profile that does not show adult content.</div>
  </div>
</div>
</x-dc>
</body>
</html>
