<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV report a problem, sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- Draft for add-support-requests. report.sent replaces the form. Done is focused; select or Menu closes it and returns to where the form opened. -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 320px; text-align: center">
    <svg aria-hidden="true" width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
    <div style="font-size: 57px; font-weight: 700">Report sent</div>
    <!-- report.sent.reference -->
    <div style="font-size: 38px; font-weight: 600; letter-spacing: 2px">Reference R-4F7K2Q</div>
    <div style="font-size: 29px; line-height: 1.4; color: #D7DEE8">If you write to support@code-crave.se, quote this reference.</div>
    <!-- report.sent.done: focused (Focus token) -->
    <div style="margin-top: 16px; height: 72px; padding: 0 72px; border-radius: 36px; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,.45); font-size: 29px; font-weight: 600; display: flex; align-items: center">Done</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
