<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV player panel, subtitles with the switch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1A2535; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- Live video stage, still playing (design-system/live-video-keeps-playing-under-overlays). -->
  <div style="position: absolute; inset: 0; background: #1A2535"></div>

  <!-- player.panel on the Subtitles segment (player-controls-and-playback-errors). add-subtitle-preferences adds player.panel.subtitles after the segments, focused here. -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 470px; box-sizing: border-box; padding: 40px 64px 36px; background: rgba(8, 10, 14, 0.88); display: flex; flex-direction: column; gap: 30px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; gap: 24px; align-items: center">
        <!-- player.panel.segments -->
        <div style="display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.08)">
          <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Info</span>
          <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Audio</span>
          <span style="font-size: 26px; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #F2F4F8">Subtitles</span>
        </div>
        <!-- player.panel.subtitles: the switch in the segment style, focused (white card). Reads "Subtitles On" or "Subtitles Off"; select flips it and the panel stays. Right from the last segment reaches it. Not shown when the stream has no subtitles. -->
        <span style="display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,.45)">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="3" fill="currentColor"/><path d="M10.5 10a2 2 0 1 0 0 3M16.5 10a2 2 0 1 0 0 3" fill="none" stroke="#F2F4F8" stroke-width="2" stroke-linecap="round"/></svg>
          Subtitles On
        </span>
      </div>
      <!-- player.panel.hint -->
      <div style="font-size: 22px; color: #A7B0BF">Menu closes</div>
    </div>

    <!-- player.panel.tracks: Off first, then each subtitle track; a forced track reads "English (Forced)" -->
    <div style="display: flex; flex-direction: column; gap: 6px; width: 900px">
      <!-- player.panel.track.0: Off -->
      <div style="display: flex; align-items: center; gap: 20px; height: 72px; padding: 0 24px; border-radius: 14px; background: rgba(255,255,255,0.06)">
        <span style="width: 26px; height: 26px; display: inline-block"></span>
        <span style="font-size: 29px; flex: 1 1 auto">Off</span>
      </div>
      <!-- player.panel.track.1, selected -->
      <div style="display: flex; align-items: center; gap: 20px; height: 72px; padding: 0 24px; border-radius: 14px; background: rgba(255,255,255,0.06)">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        <span style="font-size: 29px; flex: 1 1 auto">English</span>
      </div>
      <!-- player.panel.track.2 -->
      <div style="display: flex; align-items: center; gap: 20px; height: 72px; padding: 0 24px; border-radius: 14px; background: rgba(255,255,255,0.06)">
        <span style="width: 26px; height: 26px; display: inline-block"></span>
        <span style="font-size: 29px; flex: 1 1 auto">English (Forced)</span>
      </div>
      <!-- player.panel.track.3 -->
      <div style="display: flex; align-items: center; gap: 20px; height: 72px; padding: 0 24px; border-radius: 14px; background: rgba(255,255,255,0.06)">
        <span style="width: 26px; height: 26px; display: inline-block"></span>
        <span style="font-size: 29px; flex: 1 1 auto">German</span>
      </div>
    </div>
  </div>

  <!-- player.subtitles.cue: under the panel, centered near the bottom of the picture, 46 pt semibold white on a 0.6 black backdrop -->
  <div style="position: absolute; left: 0; right: 0; bottom: 96px; display: flex; justify-content: center">
    <span style="font-size: 46px; font-weight: 600; line-height: 1.3; padding: 8px 22px; border-radius: 10px; background: rgba(0,0,0,0.6); color: #FFFFFF; text-align: center">I didn't see you yesterday.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
