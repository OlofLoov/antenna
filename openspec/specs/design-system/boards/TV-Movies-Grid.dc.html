<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV movies, grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- movies.grid: a pushed screen under the tab bar, reached from a Genres chip (drawn), My list, Continue watching "See all" or All movies. Menu returns to the rows. Posters are the row card size (212 by 318), six per row, 20 gap, 24 between rows. The Continue watching grid uses the 352 by 198 cards instead -->

  <!-- Top bar: tvOS tab bar. Movies is selected but not focused (0.12), because focus is on the first poster -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; width: 260px">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
      <span>Antenna</span>
    </div>
    <div style="display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.08)">
      <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Live</span>
      <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Guide</span>
      <span style="font-size: 26px; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #F2F4F8">Movies</span>
      <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Series</span>
      <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Search</span>
    </div>
    <div style="width: 260px; text-align: right; font-size: 34px; font-weight: 600; letter-spacing: 0.5px">21:37</div>
  </div>

  <!-- Header: the list name and "<n> titles", same type as a row header -->
  <div style="position: absolute; left: 0; right: 0; top: 128px; padding: 0 64px; display: flex; justify-content: space-between; align-items: baseline">
    <div style="font-size: 28px; font-weight: 700">Thriller</div>
    <div style="font-size: 20px; color: #A7B0BF">187 titles</div>
  </div>

  <!-- Grid. The first poster has focus: 5 pt white ring and shadow. Posters carry no caption; the third row is cut by the frame to show the page scrolls -->
  <div style="position: absolute; left: 0; right: 0; top: 180px; bottom: 0; padding: 0 64px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(6, 212px); column-gap: 20px; row-gap: 24px">
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2A3A52; box-shadow: 0 0 0 5px #F2F4F8, 0 16px 40px rgba(0,0,0,0.55)"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3B2F4A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A3A2F"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F4A3B"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #334155"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A2F3A"></div>

      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F3F4A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3A4A2F"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #22304A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A2F3A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3B2F4A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F4A3B"></div>

      <div style="width: 212px; height: 318px; border-radius: 12px; background: #334155"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #4A3A2F"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2A3A52"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #3A4A2F"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #2F3F4A"></div>
      <div style="width: 212px; height: 318px; border-radius: 12px; background: #22304A"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
