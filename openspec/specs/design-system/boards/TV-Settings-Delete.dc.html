<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV delete source confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- Delete source on TV-Settings-Details opens a system alert. tvOS dims and blurs the page behind it; the app draws nothing of its own (design-system/modals-are-system-presentations). -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- the details page behind, as on TV-Settings-Details -->
  <div style="position: absolute; left: 80px; right: 80px; top: 60px; bottom: 60px; display: flex; gap: 80px; font-size: 29px">
    <div style="width: 560px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center">
      <div style="font-size: 48px; font-weight: 600">Home provider</div>
      <div style="font-size: 31px; color: #A7B0BF">Xtream login</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px">
      <div style="height: 66px; display: flex; align-items: center; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)">Refresh now</div>
      <div style="height: 66px; display: flex; align-items: center; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)">Move up</div>
      <div style="height: 66px; display: flex; align-items: center; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)">Move down</div>
      <div style="height: 66px; display: flex; align-items: center; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08); color: #FF5F57">Delete source</div>
    </div>
  </div>

  <!-- the system backdrop -->
  <div style="position: absolute; inset: 0; background: rgba(11,14,19,0.6); backdrop-filter: blur(40px)"></div>

  <!-- settings.deleteConfirm: the system alert, centered. Title and message are the system's styles. -->
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 760px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
    <div style="font-size: 38px; font-weight: 600">Delete Home provider?</div>
    <div style="font-size: 29px; line-height: 38px; color: #D7DEE8">Removes its 412 channels, 3 favorites and guide from every device signed in to your iCloud account.</div>
    <div style="display: flex; flex-direction: column; gap: 16px; width: 560px; margin-top: 16px">
      <!-- settings.confirmDelete: destructive -->
      <div style="height: 72px; border-radius: 999px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; font-size: 29px; font-weight: 600; color: #FF5F57">Delete</div>
      <!-- Cancel: focused, the system platter -->
      <div style="height: 72px; border-radius: 999px; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 29px; font-weight: 600; transform: scale(1.03); box-shadow: 0 12px 32px rgba(0,0,0,.45)">Cancel</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
