<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV system tab bar over Live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- adopt-tvos-tab-view: the system TabView bar over the dimmed live picture. Live is focused; Settings is the last tab. No mark and no clock in the bar; the info bar and pages draw the clock. -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(135deg, #1A2535, #0B0E13); font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8">
  <!-- The picture, dimmed while the bar shows -->
  <div style="position: absolute; inset: 0; background: rgba(8,10,14,0.55)"></div>
  <!-- System tab bar: Liquid Glass capsule, 68 pt tall, 46 pt from the top, centered -->
  <div style="position: absolute; top: 46px; left: 50%; transform: translateX(-50%); height: 68px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.16); backdrop-filter: blur(30px); display: flex; align-items: center; gap: 4px; font-size: 29px">
    <!-- Live, focused: the system light platter with dark text -->
    <div style="height: 56px; padding: 0 28px; border-radius: 999px; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; font-weight: 600">Live</div>
    <div style="height: 56px; padding: 0 28px; display: flex; align-items: center">Guide</div>
    <div style="height: 56px; padding: 0 28px; display: flex; align-items: center">Movies</div>
    <div style="height: 56px; padding: 0 28px; display: flex; align-items: center">Series</div>
    <!-- shell.tab.search: the system search tab (tvos-shell/the-tabs-in-order), drawn as a magnifying glass, read as "Search" -->
    <div role="tab" aria-label="Search" style="height: 56px; padding: 0 28px; display: flex; align-items: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
    <div style="height: 56px; padding: 0 28px; display: flex; align-items: center">Settings</div>
  </div>
</div>
</x-dc>
</body>
</html>
