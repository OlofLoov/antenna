<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone episode description sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- The series page behind, dimmed by the system sheet. -->
  <div style="position: absolute; inset: 0; background: #0B0E13; opacity: 0.6"></div>

  <!-- title.about: a system sheet at medium height, draggable to large, opened by Description in an episode row's menu. iPad and Mac show it at form size. Done, a swipe down or Escape closes it. -->
  <div style="position: absolute; left: 0; right: 0; top: 380px; bottom: 0; background: #161B24; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3); align-self: center; margin-top: 6px"></div>
    <!-- title.about.done, trailing, 44 pt target -->
    <div style="display: flex; justify-content: flex-end; padding: 6px 16px 0">
      <button type="button" style="font: inherit; font-size: 17px; font-weight: 600; min-height: 44px; padding: 0 4px; border: 0; background: none; color: #5BB8FF; cursor: pointer">Done</button>
    </div>
    <!-- title.about.text: scrolls when longer than the sheet -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 24px; overflow: hidden">
      <!-- Heading: "4. Low Water", or the title's name -->
      <div style="font-size: 22px; font-weight: 700; line-height: 1.2">4. Low Water</div>
      <!-- Details line: "Season 1 · Episode 4 · 44 min"; left out when empty -->
      <div style="font-size: 15px; color: #D7DEE8">Season 1 · Episode 4 · 44 min</div>
      <!-- The whole description, Dynamic Type body -->
      <div style="font-size: 17px; line-height: 1.45">The ferry runs aground off the north point and the sisters spend the night on the ice, waiting for the tide. Ada finds the logbook their father kept, and the last entry is not in his hand.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
