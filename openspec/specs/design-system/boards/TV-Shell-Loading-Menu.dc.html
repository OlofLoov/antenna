<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV shell, Menu over loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; align-items: center; justify-content: center">

  <!-- shell.player: ground color until the first source finishes. No tab bar, no clock. -->

  <!-- shell.loading: one row per source, name 26 pt, muted detail 22 pt (design-system/loading-shows-real-progress-per-step) -->
  <div style="width: 1000px; border-radius: 20px; background: rgba(255,255,255,0.06); box-sizing: border-box; padding: 16px 32px; display: flex; flex-direction: column">

    <!-- shell.loading.<sourceId>: still loading, indeterminate indicator -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px; border-bottom: 1px solid rgba(255,255,255,0.08)">
      <span style="width: 44px; height: 44px; border-radius: 22px; border: 4px solid rgba(255,255,255,0.18); border-top-color: {{accent}}; box-sizing: border-box; flex: 0 0 auto"></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Home provider</div>
        <div style="font-size: 22px; color: #A7B0BF">Loading channels</div>
      </div>
    </div>

    <!-- shell.loading.<sourceId>: finished with no channels, so the shell keeps waiting for the other source -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Cabin</div>
        <div style="font-size: 22px; color: #A7B0BF">0 channels</div>
      </div>
    </div>
  </div>

  <!-- shell.scrim: full-frame dim over the loading screen -->
  <div style="position: absolute; inset: 0; background: rgba(8,10,14,0.55)"></div>

  <!-- shell.tabBar after Menu on the loading screen: Live is selected and focused; the source rows stay under the scrim and keep updating -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between">
    <!-- shell.mark: not focusable -->
    <div style="display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; width: 260px">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
      <span>Antenna</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <!-- shell.tab.live, shell.tab.guide, shell.tab.movies, shell.tab.series, shell.tab.search. Pill group on the opaque Sidebar / tab bar token because the 0.55 scrim leaves the picture visible (design-system/text-meets-contrast-minimums deviation in tvos-shell) -->
      <div style="display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: #11151C">
        <span style="font-size: 26px; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">Live</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Guide</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Movies</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Series</span>
        <span style="font-size: 26px; padding: 10px 26px; border-radius: 999px; color: #F2F4F8">Search</span>
      </div>
      <!-- shell.settings: 30 pt gear, opens the Settings sheet, not a tab -->
      <span aria-label="Settings" style="width: 56px; height: 56px; border-radius: 28px; color: #F2F4F8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </span>
    </div>
    <!-- shell.clock: not focusable -->
    <div style="width: 260px; text-align: right; font-size: 34px; font-weight: 600; letter-spacing: 0.5px">21:34</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
