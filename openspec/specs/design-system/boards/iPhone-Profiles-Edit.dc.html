<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <!-- Edit profile sheet: Cancel and Save in the bar; Save is disabled while the name is empty -->
  <div style="margin-top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <span style="font-size: 17px; color: {{accent}}">Cancel</span>
    <span style="font-size: 17px; font-weight: 600">Edit Profile</span>
    <!-- profiles.edit.save -->
    <span style="font-size: 17px; font-weight: 600; color: {{accent}}">Save</span>
  </div>
  <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 16px">
    <div style="width: 112px; height: 112px; border-radius: 56px; background: #A3E635; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700">K</div>
    <!-- profiles.edit.name -->
    <div style="align-self: stretch; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Name</div>
      <div style="height: 48px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 14px; font-size: 17px">Kids</div>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center">
        <!-- profiles.edit.color.0 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #5BB8FF; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.1 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #FFB454; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.2 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #4FD1C5; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.3 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #C084FC; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.4 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #F87171; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.5 (selected) -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #A3E635; box-sizing: border-box; border: 3px solid #F2F4F8;"></div>
        <!-- profiles.edit.color.6 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #F472B6; box-sizing: border-box; "></div>
        <!-- profiles.edit.color.7 -->
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #94A3B8; box-sizing: border-box; "></div>
    </div>
    <!-- profiles.edit.delete: absent for the last profile; asks first -->
    <div style="align-self: stretch; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 17px; color: #FF5F57">Delete Profile</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
