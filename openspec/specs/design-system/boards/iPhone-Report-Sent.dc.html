<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone report a problem, sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- Draft for add-support-requests. report.sent replaces the form once the service keeps the report. Done returns to where the form opened and clears it. The report is added to Sent reports, kept on this device without its text. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="margin-top: 54px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 16px">
    <span style="font-size: 17px; font-weight: 600">Report a problem</span>
  </div>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 32px 120px; text-align: center">
    <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
    <div style="font-size: 28px; font-weight: 700">Report sent</div>
    <!-- report.sent.reference: R- and six letters or digits, no I, L, O or U -->
    <div style="font-size: 20px; font-weight: 600; letter-spacing: 1px">Reference R-4F7K2Q</div>
    <div style="font-size: 15px; line-height: 1.4; color: #D7DEE8">To delete this report later, open Sent reports on this device.</div>
    <!-- report.sent.done: prominent button, Ground label on the accent -->
    <div style="margin-top: 16px; height: 50px; width: 100%; border-radius: 25px; background: {{accent}}; color: #0B0E13; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Done</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
