<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV settings, appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- add-accent-and-app-icons: the Apple TV Settings split page at the Appearance section, App icon focused. -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="position: absolute; left: 80px; right: 80px; top: 60px; bottom: 60px; display: flex; gap: 80px">
    <!-- settings.lead -->
    <div style="width: 560px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; text-align: center">
      <div style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 150px; line-height: 1; color: #A7B0BF">⚙</div>
      <div style="font-size: 48px; font-weight: 600">Sources &amp; Settings</div>
      <div style="font-size: 25px; color: #A7B0BF; line-height: 32px">The accent is for this profile on every device. The app icon is for this device only.</div>
    </div>
    <!-- settings.list scrolled to Appearance; the lead column shows the section's footer while one of its rows has focus -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center">
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">PREFERENCES</div>
      <div style="height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 29px; border-radius: 20px; background: rgba(255,255,255,0.08); box-sizing: border-box"><span style="flex: 1">Subtitles</span><span style="color: #A7B0BF">Auto</span></div>
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">APPEARANCE</div>
      <!-- settings.appearance.accent: pushes TV-Settings-Accent -->
      <div style="height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 29px; border-radius: 20px; background: rgba(255,255,255,0.08); box-sizing: border-box"><span style="flex: 1">Accent</span><span style="width: 22px; height: 22px; border-radius: 11px; background: {{accent}}; flex: 0 0 auto; display: inline-block"></span><span style="color: #A7B0BF">Blue</span></div>
      <!-- settings.appearance.icon: focused, the system platter. Pushes the icon choices, TV-Settings-Accent with icon thumbnails. -->
      <div style="height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 29px; border-radius: 20px; background: #F2F4F8; color: #0B0E13; transform: scale(1.03); box-shadow: 0 12px 32px rgba(0,0,0,.45); box-sizing: border-box"><span style="flex: 1">App icon</span><svg style="display: block; flex: 0 0 auto" aria-hidden="true" width="40" height="40" viewBox="0 0 240 240"><defs><radialGradient id="iconTile10g" cx="120" cy="60" r="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1A2A44"/><stop offset="1" stop-color="#0B0E13"/></radialGradient></defs><rect width="240" height="240" rx="48" fill="url(#iconTile10g)"/><g transform="translate(120 134) scale(1.05) translate(-675 59)"><mask id="iconTile10" maskUnits="userSpaceOnUse" x="560" y="-200" width="220" height="230"><rect x="560" y="-200" width="220" height="230" fill="#fff"/><path d="M659 -81L695 -59L659 -37Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/><path d="M641 -60L605 -56.3L606 -68Z" fill="#000"/></mask><g mask="url(#iconTile10)"><path d="M673 -118A59 59 0 0 1 673 0C640 0 616 -20 606 -46Q604 -54 611 -57L609 -61L612 -66Q610 -67 612 -72C624 -100 646 -118 673 -118Z" fill="#F2F4F8"/><path d="M694 -99C694 -111 700 -119 711 -120L733 -122Q740 -122 738 -116Q726 -90 727 -59Q726 -28 738 -2Q740 4 733 4L711 2C700 1 694 -7 694 -19Z" fill="#F2F4F8"/></g><g><path d="M656 -112L640 -140" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="635.0" cy="-148.7" r="10" fill="#4FD1C5"/></g><g><path d="M690 -112L704 -141" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="708.3" cy="-150.0" r="10" fill="#4FD1C5"/></g></g></svg><span style="color: #4B5563">Antuna</span></div>
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">ABOUT</div>
      <div style="height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 29px; border-radius: 20px; background: rgba(255,255,255,0.08); box-sizing: border-box"><span style="flex: 1">Version</span><span style="color: #A7B0BF">1.4 (52)</span></div>
    </div>
  </div>
  <!-- A progress bar elsewhere on Apple TV draws in the accent; focus never does. -->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#4FD1C5","#FFB454","#F472B6","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
