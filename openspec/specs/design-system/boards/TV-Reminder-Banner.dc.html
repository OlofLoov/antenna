<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV reminder banner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1A2535; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- Live video stage. The banner appears over whatever is on screen: full-screen playback, the overlay, the guide, Movies or Search. Drawn here over full-screen playback with the zap bar hidden. -->
  <div style="position: absolute; inset: 0; background: #1A2535"></div>

  <!-- reminders.banner, top right, same scrim as the overlay. Hides 20 seconds after it appears or on Menu. -->
  <div style="position: absolute; right: 64px; top: 44px; width: 640px; box-sizing: border-box; padding: 24px 28px; border-radius: 14px; background: rgba(8,10,14,0.88); box-shadow: 0 12px 32px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #A7B0BF">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#A7B0BF"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span>Reminder · Starts in 5 min</span>
    </div>
    <!-- reminders.banner.title -->
    <div style="font-size: 29px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Match of the Day</div>
    <!-- reminders.banner.body -->
    <div style="font-size: 22px; color: #D7DEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">22:00 · 104 Sport One</div>
    <div style="display: flex; gap: 14px; padding-top: 4px">
      <!-- reminders.banner.watch, focused on appearance (Focus token) -->
      <button type="button" style="font: inherit; font-size: 22px; font-weight: 600; height: 64px; padding: 0 28px; border-radius: 10px; border: 0; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,0.45); cursor: pointer">Watch</button>
      <!-- reminders.banner.dismiss -->
      <button type="button" style="font: inherit; font-size: 22px; font-weight: 600; height: 64px; padding: 0 28px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.12); color: #F2F4F8; cursor: pointer">Dismiss</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
