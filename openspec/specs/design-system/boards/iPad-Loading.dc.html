<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad and Mac browse, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex">
  <!-- Sidebar: sections + groups -->
  <div style="width: 232px; flex: 0 0 auto; box-sizing: border-box; padding: 24px 12px; background: #11151C; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 18px; font-size: 20px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
      <span>Antenna</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; font-weight: 600; color: #F2F4F8; background: rgba(255,255,255,0.12)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      <span>Series</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>

    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 22px 12px 8px">Groups</div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>Favorites</span><span style="font-size: 14px; color: #A7B0BF">12</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>All channels</span><span style="font-size: 14px; color: #A7B0BF">412</span></div>

    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #A7B0BF">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Sources &amp; Settings</span>
    </div>
  </div>

  <!-- Channel list -->
  <div style="width: 352px; flex: 0 0 auto; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column">
    <!-- browse.loading replaces the channel list (AC-16): one row per source -->
    <div style="display: flex; flex-direction: column; padding: 22px 8px 4px; gap: 2px">
    <!-- browse.loading.home -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; padding: 0 10px; border-radius: 10px">
      <span style="font-size: 16px">Home server</span>
      <span style="font-size: 15px; color: #A7B0BF; font-variant-numeric: tabular-nums">412 channels</span>
    </div>
    <!-- browse.loading.cabin -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; padding: 0 10px; border-radius: 10px">
      <span style="font-size: 16px">Cabin M3U</span>
      <span style="display: inline-flex; color: #A7B0BF"><svg aria-label="Loading" role="img" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg></span>
    </div>
    </div>
  </div>

  <!-- Player + now/next -->
  <div style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <!-- browse.player, nothing selected (AC-23): ground colour, mark, "Select a channel"; browse.panel hidden -->
    <div style="width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #0B0E13; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #A7B0BF">
      <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
      <span style="font-size: 15px">Select a channel</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
