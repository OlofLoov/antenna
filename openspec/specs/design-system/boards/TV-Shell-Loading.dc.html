<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV shell, loading at launch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; align-items: center; justify-content: center">

  <!-- shell.player: ground color until the first source finishes. No tab bar, no clock. -->

  <!-- shell.loadingMark: BrandMark.Word, 360 wide, 48 above the panel, plays Tuning while the screen shows (tvos-shell/the-loading-screen-tunes-in) -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 48px">
  <svg aria-label="Antuna" role="img" width="361" height="94" viewBox="-6 -192 760 198"><path d="M99.0 -59.0A40.0 40.0 0 1 0 19.0 -59.0A40.0 40.0 0 1 0 99.0 -59.0M99.0 -99.0V-19.0M147.0 -19.0V-99.0M147.0 -59.0A40.0 40.0 0 0 1 227.0 -59.0V-19.0M289.0 -139.0V-59.0A40.0 40.0 0 0 0 329.0 -19.0M275.0 -99.0H323.0M377.0 -99.0V-59.0A40.0 40.0 0 0 0 457.0 -59.0M457.0 -99.0V-19.0M505.0 -19.0V-99.0M505.0 -59.0A40.0 40.0 0 0 1 585.0 -59.0V-19.0" fill="none" stroke="#F2F4F8" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><mask id="loadingMark" maskUnits="userSpaceOnUse" x="560" y="-200" width="220" height="230"><rect x="560" y="-200" width="220" height="230" fill="#fff"/><path d="M659 -81L695 -59L659 -37Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round" transform="translate(677 -59) translate(-21 -21) scale(0.001) translate(-677 59)"/><path d="M641 -60L605 -56.3L606 -68Z" fill="#000" transform="translate(641 -60.5) scale(1 2.1) translate(-641 60.5)"/><circle cx="647" cy="-81" r="10" fill="#000" transform="translate(647 -81) scale(1.0 1.0) translate(-647 81)"/></mask><g mask="url(#loadingMark)"><path d="M673 -118A59 59 0 0 1 673 0C640 0 616 -20 606 -46Q604 -54 611 -57L609 -61L612 -66Q610 -67 612 -72C624 -100 646 -118 673 -118Z" fill="#F2F4F8"/><path d="M694 -99C694 -111 700 -119 711 -120L733 -122Q740 -122 738 -116Q726 -90 727 -59Q726 -28 738 -2Q740 4 733 4L711 2C700 1 694 -7 694 -19Z" fill="#F2F4F8"/></g><g transform="rotate(-14 656 -112)"><path d="M656 -112L640 -140" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="635.0" cy="-148.7" r="18.0" fill="none" stroke="#4FD1C5" stroke-width="3" opacity="0.35"/><circle cx="635.0" cy="-148.7" r="10" fill="#4FD1C5"/></g><g transform="rotate(-9 690 -112)"><path d="M690 -112L704 -141" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="708.3" cy="-150.0" r="10" fill="#4FD1C5"/></g></svg>
  <!-- shell.loading: one row per source, name 26 pt, muted detail 22 pt (design-system/loading-shows-real-progress-per-step) -->
  <div style="width: 1000px; border-radius: 20px; background: rgba(255,255,255,0.06); box-sizing: border-box; padding: 16px 32px; display: flex; flex-direction: column">

    <!-- shell.loading.<sourceId>: still loading, indeterminate indicator -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px; border-bottom: 1px solid rgba(255,255,255,0.08)">
      <span style="width: 44px; height: 44px; border-radius: 22px; border: 4px solid rgba(255,255,255,0.18); border-top-color: {{accent}}; box-sizing: border-box; flex: 0 0 auto"></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Home provider</div>
        <div style="font-size: 22px; color: #A7B0BF">Loading channels</div>
      </div>
    </div>

    <!-- shell.loading.<sourceId>: finished with no channels, so the shell keeps waiting for the other source -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Cabin</div>
        <div style="font-size: 22px; color: #A7B0BF">0 channels</div>
      </div>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
