<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone who is watching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <!-- profiles.picker: at launch with two or more profiles, before the tabs (profiles/who-s-watching-at-launch). Two columns; tap a tile to choose. -->
  <div style="margin-top: 150px; text-align: center; font-size: 28px; font-weight: 700">Who's watching?</div>
  <div style="margin-top: 48px; display: flex; flex-direction: column; align-items: center">
    <div style="display: grid; grid-template-columns: 130px 130px; column-gap: 40px; row-gap: 32px; justify-items: center">
      <!-- profiles.tile.0 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 56px; background: #5BB8FF; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700">D</div>
        <div style="font-size: 17px">Dad</div>
      </div>
      <!-- profiles.tile.1 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 56px; background: #F87171; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700">M</div>
        <div style="font-size: 17px">Mum</div>
      </div>
      <!-- profiles.tile.2 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 112px; height: 112px; border-radius: 56px; background: #A3E635; color: #0B0E13; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700">K</div>
        <div style="font-size: 17px">Kids</div>
      </div>
    </div>
  </div>
  <!-- profiles.manage -->
  <div style="margin-top: auto; margin-bottom: 60px; text-align: center; font-size: 17px; color: {{accent}}">Manage profiles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
