<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone add a source, Xtream, refreshed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- onboarding.form: a system sheet at the large detent. The same grouped Form as source details, so adding and editing a source look alike. iPad and Mac show the same sheet centered. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">
  <!-- the sheet: system grouped background, top corners follow the device -->
  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #1C1C1E; border-radius: 38px 38px 0 0; display: flex; flex-direction: column">

    <!-- toolbar: Cancel (glass, leading), title (headline 17), Connect (glassProminent in the accent tint, trailing) -->
    <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
      <!-- onboarding.back -->
      <div style="height: 44px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,0.10); display: flex; align-items: center; font-size: 17px">Cancel</div>
      <div style="font-size: 17px; font-weight: 600">Add a source</div>
      <!-- onboarding.connect: disabled until the required fields are filled -->
      <div style="height: 44px; padding: 0 16px; border-radius: 999px; background: #5BB8FF; color: #0B0E13; display: flex; align-items: center; font-size: 17px; font-weight: 600">Connect</div>
    </div>

    <div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 8px">
      <!-- onboarding.kind: a menu picker row. Every kind name shows in full in the menu. -->
      <div style="border-radius: 26px; background: #2C2C2E; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 17px">
        <span>Type</span><span style="color: #A7B0BF">Xtream login ⌃⌄</span>
      </div>

      <!-- section header, text style: footnote (13), muted, sentence case -->
      <div style="font-size: 13px; color: #A7B0BF; padding: 16px 20px 0">Login</div>
      <div style="border-radius: 26px; background: #2C2C2E; display: flex; flex-direction: column">
        <!-- onboarding.field.name, body (17). TextField with a prompt, label as the row title -->
        <div style="height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 17px; gap: 16px; border-bottom: 0.5px solid rgba(255,255,255,0.12)"><span style="width: 96px">Name</span><span style="color: #8E8E93">Optional</span></div>
        <!-- onboarding.field.server -->
        <div style="height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 17px; gap: 16px; border-bottom: 0.5px solid rgba(255,255,255,0.12)"><span style="width: 96px">Server</span><span style="color: #8E8E93">http://</span></div>
        <!-- onboarding.field.username -->
        <div style="height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 17px; gap: 16px; border-bottom: 0.5px solid rgba(255,255,255,0.12)"><span style="width: 96px">Username</span><span style="color: #8E8E93">Required</span></div>
        <!-- onboarding.field.password: SecureField with the reveal button at the trailing edge -->
        <div style="height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 17px; gap: 16px"><span style="width: 96px">Password</span><span style="color: #8E8E93; flex: 1">Required</span><span style="color: #A7B0BF">👁</span></div>
      </div>
      <!-- section footer, text style: footnote (13), muted -->
      <div style="font-size: 13px; color: #A7B0BF; padding: 0 20px; line-height: 18px">Saved in your iCloud Keychain only. Antenna has no servers and never sees your login.</div>

      <!-- clipboard offer: a plain Form section with a button row, no tinted card -->
      <div style="border-radius: 26px; background: #2C2C2E; margin-top: 16px; height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 17px; color: #5BB8FF">Fill in from the copied link</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
