<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad settings, appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- add-accent-and-app-icons: Sources & Settings on iPad with the Appearance section. The App icon page pushes in the same column (iPhone-Settings-AppIcon at this width). -->
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="flex: 1 1 auto; display: flex; min-height: 0">
    <!-- The sidebar of the wide layout; Sources & Settings is selected. -->
    <div style="width: 320px; background: #11151C; padding: 72px 12px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; font-size: 17px">
      <div style="height: 44px; display: flex; align-items: center; padding: 0 12px">Live</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 12px">Guide</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 12px">Movies</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 12px">Search</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,0.12)">Sources &amp; Settings</div>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column">
      <div style="margin-top: 24px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Sources &amp; Settings</div>
      <!-- settings.root, scrolled to Preferences -->
      <div style="width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Preferences</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; box-sizing: border-box; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,0.08)"><span style="flex: 1 1 auto">Open on launch</span><span style="color: {{accent}}">Live</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; box-sizing: border-box; font-size: 17px"><span style="flex: 1 1 auto">Subtitles</span><span style="color: {{accent}}">Auto</span></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Appearance</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- settings.appearance.accent: a NavigationLink; the value is a 14 pt swatch and the name of the accent the environment holds. It pushes the accent choices, the list of iPhone-Settings-AppIcon with swatches. -->
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; box-sizing: border-box; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,0.08)"><span style="flex: 1 1 auto">Accent</span><span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; flex: 0 0 auto; display: inline-block"></span><span style="color: #A7B0BF">Blue ›</span></div>
      <!-- settings.appearance.icon: a NavigationLink to iPhone-Settings-AppIcon; the value is a 24 pt thumbnail and the name of the icon the Home Screen shows. -->
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; box-sizing: border-box; font-size: 17px"><span style="flex: 1 1 auto">App icon</span><svg style="display: block; flex: 0 0 auto" aria-hidden="true" width="24" height="24" viewBox="0 0 240 240"><rect width="240" height="240" rx="60" fill="#0B0E13"/><g transform="translate(120 134) scale(1.05) translate(-675 59)"><mask id="iconTile9" maskUnits="userSpaceOnUse" x="560" y="-200" width="220" height="230"><rect x="560" y="-200" width="220" height="230" fill="#fff"/><path d="M659 -81L695 -59L659 -37Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/><path d="M641 -60L605 -56.3L606 -68Z" fill="#000"/></mask><g mask="url(#iconTile9)"><path d="M673 -118A59 59 0 0 1 673 0C640 0 616 -20 606 -46Q604 -54 611 -57L609 -61L612 -66Q610 -67 612 -72C624 -100 646 -118 673 -118Z" fill="#F2F4F8"/><path d="M694 -99C694 -111 700 -119 711 -120L733 -122Q740 -122 738 -116Q726 -90 727 -59Q726 -28 738 -2Q740 4 733 4L711 2C700 1 694 -7 694 -19Z" fill="#F2F4F8"/></g><g><path d="M656 -112L640 -140" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="635.0" cy="-148.7" r="10" fill="#F2F4F8"/></g><g><path d="M690 -112L704 -141" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="708.3" cy="-150.0" r="10" fill="#F2F4F8"/></g></g></svg><span style="color: #A7B0BF">Mono ›</span></div>
    </div>
    <!-- settings.appearance.footer -->
    <div style="font-size: 13px; line-height: 1.4; color: #A7B0BF; padding: 0 4px 8px">The accent is for this profile on every device. The app icon is for this device only.</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#4FD1C5","#FFB454","#F472B6","#C084FC"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
