<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone title page, Play on menu, local network refused</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- play-on-apple-tv/the-local-network-is-asked-for-only-when-needed: as iPhone-Title-PlayOn, with local network access refused. No TV can be ready now, so every row reads "Plays when Antuna opens there", and a last row after a separator, "Allow local network access", opens Antuna's page in Settings. With one TV the control is this menu too, so the Settings row can show. -->
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">
  <!-- The title page behind, as iPhone-Title-PlayOn -->
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 300px; background: linear-gradient(180deg, #3B4A5E 0%, #1B2330 70%, #0B0E13 100%)"></div>
  <div style="position: absolute; left: 16px; top: 318px; display: flex; flex-direction: column; gap: 10px; width: 358px">
    <div style="font-size: 28px; font-weight: 800; font-family: ui-rounded, -apple-system, system-ui, sans-serif">Salt Road</div>
    <div style="height: 44px; border-radius: 10px; background: #F2F4F8; color: #0B0E13; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Play</div>
    <div style="display: flex; gap: 8px">
      <div style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.14); font-size: 15px; font-weight: 600; display: flex; align-items: center">Add to My list</div>
      <!-- title.playOn.menu -->
      <div style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.22); font-size: 15px; font-weight: 600; display: flex; align-items: center">Play on</div>
    </div>
  </div>
  <!-- title.playOn.menu open: the system menu -->
  <div role="menu" style="position: absolute; left: 120px; top: 470px; width: 254px; border-radius: 14px; background: rgba(40,44,52,0.96); box-shadow: 0 12px 32px rgba(0,0,0,0.45); overflow: hidden">
    <!-- title.playOn.menu.device -->
    <div role="menuitem" style="padding: 11px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px">Living Room</span><span style="font-size: 13px; color: #A7B0BF">Plays when Antuna opens there</span></div>
    <div role="menuitem" style="padding: 11px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px">Bedroom</span><span style="font-size: 13px; color: #A7B0BF">Plays when Antuna opens there</span></div>
    <div style="height: 8px; background: rgba(0,0,0,0.25)"></div>
    <!-- playOn.menu.settings -->
    <div role="menuitem" style="padding: 11px 16px; font-size: 17px">Allow local network access</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
