<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone live TV, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <!-- Player, nothing selected (browse.player): ground color, mark, no controls -->
  <div style="margin-top: 54px; width: 390px; height: 219px; background: #0B0E13; position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #A7B0BF">
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/></svg>
    <span style="font-size: 15px">Select a channel</span>
  </div>

  <!-- browse.loading replaces the chips and the list (live-tv-on-iphone-ipad-mac/sources-that-fail-are-empty-or-wait-for-a-login); browse.nowPlaying hidden -->
  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 12px 8px 4px">
    <!-- browse.loading.mark: BrandMark.Letter, 72 tall, plays Tuning while the list shows (live-tv-on-iphone-ipad-mac/the-loading-list-tunes-in) -->
    <div style="display: flex; justify-content: center; padding: 8px 0 4px"><svg aria-label="Antuna" role="img" width="72" height="72" viewBox="575 -192 200 200"><mask id="loadingMark" maskUnits="userSpaceOnUse" x="560" y="-200" width="220" height="230"><rect x="560" y="-200" width="220" height="230" fill="#fff"/><path d="M659 -81L695 -59L659 -37Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round" transform="translate(677 -59) translate(-21 -21) scale(0.001) translate(-677 59)"/><path d="M641 -60L605 -56.3L606 -68Z" fill="#000" transform="translate(641 -60.5) scale(1 2.1) translate(-641 60.5)"/><circle cx="647" cy="-81" r="10" fill="#000" transform="translate(647 -81) scale(1.0 1.0) translate(-647 81)"/></mask><g mask="url(#loadingMark)"><path d="M673 -118A59 59 0 0 1 673 0C640 0 616 -20 606 -46Q604 -54 611 -57L609 -61L612 -66Q610 -67 612 -72C624 -100 646 -118 673 -118Z" fill="#F2F4F8"/><path d="M694 -99C694 -111 700 -119 711 -120L733 -122Q740 -122 738 -116Q726 -90 727 -59Q726 -28 738 -2Q740 4 733 4L711 2C700 1 694 -7 694 -19Z" fill="#F2F4F8"/></g><g transform="rotate(-14 656 -112)"><path d="M656 -112L640 -140" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="635.0" cy="-148.7" r="18.0" fill="none" stroke="#4FD1C5" stroke-width="3" opacity="0.35"/><circle cx="635.0" cy="-148.7" r="10" fill="#4FD1C5"/></g><g transform="rotate(-9 690 -112)"><path d="M690 -112L704 -141" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/><circle cx="708.3" cy="-150.0" r="10" fill="#4FD1C5"/></g></svg></div>
    <!-- browse.loading.home -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; padding: 0 8px; border-radius: 10px">
      <span style="font-size: 15px">Home server</span>
      <span style="font-size: 15px; color: #A7B0BF; font-variant-numeric: tabular-nums">412 channels</span>
    </div>
    <!-- browse.loading.cabin -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; padding: 0 8px; border-radius: 10px">
      <span style="font-size: 15px">Cabin M3U</span>
      <span style="display: inline-flex; color: #A7B0BF"><svg aria-label="Loading" role="img" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg></span>
    </div>
  </div>

  <!-- Tab bar (live-tv-on-iphone-ipad-mac/the-iphone-tab-bar): Live, Guide, Movies and Series in the system bar, the open tab in the accent, and Search as the system's round search button at the trailing end. No Settings tab: Settings opens from the profile button (profile.button). -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; gap: 10px; align-items: center; width: 100%">
    <div role="tablist" style="flex: 1 1 auto; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center">
      <div role="tab" aria-selected="true" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
        <span>Live</span>
      </div>
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
        <span>Guide</span>
      </div>
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
        <span>Movies</span>
      </div>
      <div role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #A7B0BF; width: 64px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="15" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v9"/><path d="M9 10.5v5l4-2.5z" fill="currentColor"/></svg>
        <span>Series</span>
      </div>
    </div>
    <div role="button" aria-label="Search" aria-pressed="false" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); color: #F2F4F8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
