<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone groups, passcode prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- The Groups list beneath, dimmed -->
  <div style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Groups</div>
  <div style="position: absolute; inset: 0; background: rgba(8,10,14,0.72)"></div>

  <!-- groups.passcode as a sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; box-sizing: border-box; padding: 12px 16px 34px; border-radius: 16px 16px 0 0; background: #11151C; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></div>
    <div style="width: 100%; display: flex; justify-content: flex-end"><span style="font-size: 17px; color: #5BB8FF">Cancel</span></div>
    <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <div style="font-size: 22px; font-weight: 700">Enter passcode</div>
    <div style="font-size: 15px; color: #A7B0BF; margin-top: -8px">Movies is locked.</div>

    <!-- groups.passcode.digit.1 to .4; the system numeric keyboard types into them -->
    <div style="display: flex; gap: 12px; padding: 8px 0">
      <div style="width: 56px; height: 64px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #F2F4F8; display: inline-block"></span></div>
      <div style="width: 56px; height: 64px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #F2F4F8; display: inline-block"></span></div>
      <div style="width: 56px; height: 64px; border-radius: 12px; background: rgba(255,255,255,0.08)"></div>
      <div style="width: 56px; height: 64px; border-radius: 12px; background: rgba(255,255,255,0.08)"></div>
    </div>

    <!-- groups.passcode.error -->
    <div style="font-size: 15px; color: #FF5F57; height: 20px">Wrong passcode</div>

    <!-- groups.passcode.forgot -->
    <a href="#" style="font-size: 15px; color: #5BB8FF; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">Forgot passcode?</a>

    <div style="flex: 1 1 auto"></div>
    <div style="font-size: 13px; color: #A7B0BF">The system numeric keyboard sits here.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
