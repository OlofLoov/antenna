<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad and Mac person page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex">
  <!-- Sidebar as on iPad-Title, drawn as a plain column here: the person page replaces the content column only -->
  <div style="width: 232px; flex: 0 0 auto; background: #11151C; border-right: 1px solid rgba(255,255,255,0.08)"></div>
  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <!-- person.back: 44 pt, returns to the title page or Search with the starting name in view -->
  <div style="display: flex; align-items: center; padding: 14px 24px 0; height: 44px; box-sizing: border-box">
    <button type="button" style="font: inherit; font-size: 17px; height: 44px; padding: 0 8px 0 0; border: 0; background: transparent; color: {{accent}}; display: flex; align-items: center; gap: 4px; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>The Long Harbor</span>
    </button>
  </div>
  <!-- person.header -->
  <div style="display: flex; align-items: center; gap: 20px; padding: 0 24px">
    <div style="width: 112px; height: 112px; border-radius: 56px; background: #26344A; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: #A7B0BF">MH</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 36px; font-weight: 800; letter-spacing: -0.5px">Mira Holt</div>
      <div style="font-size: 14px; color: #A7B0BF">Acting · 9 in your sources · Filmography from TMDB</div>
    </div>
  </div>
  <!-- person.row.movies, person.row.series, person.row.directed (browse-by-person/a-person-s-page): only titles the user's sources have, newest release first, each row hidden when empty. A poster acts as any poster: it opens the title page. -->
  <!-- person.row.movies -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 18px; font-weight: 700">Movies</div>
      <div style="font-size: 13px; color: #A7B0BF">6 titles</div>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 24px; overflow: hidden">
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #3A4A2F; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #3B2F4A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #2F4A3B; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #4A3A2F; flex: 0 0 auto"></div>
    </div>
  </div>
  <!-- person.row.series -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 18px; font-weight: 700">Series</div>
      <div style="font-size: 13px; color: #A7B0BF">3 titles</div>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 24px; overflow: hidden">
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 132px; height: 198px; border-radius: 10px; background: #2F3F4A; flex: 0 0 auto"></div>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
