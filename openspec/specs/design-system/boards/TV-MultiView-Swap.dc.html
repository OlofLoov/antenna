<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV multi-view, one tile full screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1E2B3D; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- multiView.root, swapped: tile 2 fills the screen; tiles 1, 3 and 4 keep playing muted and are not drawn -->
  <!-- multiView.tile.2 0,0 1920x1080 -->
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #1E2B3D"></div>

  <!-- multiView.swapBadge: top left at 64, 44 like the tv-zap-bar-and-number-entry number pill; shown 5 s after the swap; 24 pt on the scrim -->
  <div style="position: absolute; left: 64px; top: 44px; display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 24px; border-radius: 14px; background: rgba(8, 10, 14, 0.82); font-size: 24px">
    <span style="display: inline-flex"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span>
    <span style="font-weight: 600">Multi-view · tile 2 of 4</span>
    <span style="color: #A7B0BF">Play/Pause to return</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
