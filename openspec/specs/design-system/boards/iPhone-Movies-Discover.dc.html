<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone movies, Trending, Recently watched and Recently added</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- Same page as iPhone-Movies.dc.html scrolled past Recently added. The hero has scrolled away; movies.kind and the search button stay pinned on the ground color -->

  <!-- Pinned top bar -->
  <div style="height: 98px; flex: 0 0 auto; position: relative; background: #0B0E13; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <div style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
      <div role="tablist" aria-label="Kind" style="display: flex; gap: 2px; height: 44px; padding: 4px; border-radius: 22px; background: rgba(255,255,255,0.08); box-sizing: border-box">
        <span role="tab" aria-selected="true" style="display: flex; align-items: center; font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 18px; background: #F2F4F8; color: #0B0E13">Movies</span>
        <span role="tab" aria-selected="false" style="display: flex; align-items: center; font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 18px; color: #F2F4F8">Series</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Search" style="font: inherit; width: 36px; height: 36px; border-radius: 18px; border: 0; background: rgba(255,255,255,0.08); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- movies.row.trending (movies-and-series-browsing/trending-in-your-sources): TMDB trending this week, only titles the user's sources have, trending order, provider posters, at most 20, hidden below three or with lookups off. Comes after Continue watching and My list, scrolled away here. -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Trending</div>
      <div style="font-size: 13px; color: #A7B0BF">This week on TMDB · 14 in your sources</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3A4A2F; flex: 0 0 auto"></div>
    </div>
  </div>

  <!-- movies.row.recentlyWatched (movies-and-series-browsing/recently-watched): what this profile played on any device, finished included, newest first, at most 20. Needs no lookups. -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Recently watched</div>
      <div style="font-size: 13px; color: #A7B0BF">9 titles</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2A3A52; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3B2F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A3A2F; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F4A3B; flex: 0 0 auto"></div>
    </div>
  </div>

  <!-- Recently added with movies.row.recentlyAdded.seeAll (movies-and-series-browsing/see-everything-new): opens the existing grid, newest first. Category rows follow. -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Recently added</div>
      <div style="font-size: 13px; color: {{accent}}">See all</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3A4A2F; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A2F3A; flex: 0 0 auto"></div>
    </div>
  </div>

  <div style="flex: 1 1 auto"></div>

  <!-- Tab bar -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
