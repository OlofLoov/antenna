<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone settings, appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- add-accent-and-app-icons: the Appearance section of Sources & Settings on iPhone, after Preferences. Switch the accent prop to see what follows the profile: the picker values and the swatch. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">
  <div style="margin-top: 54px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Sources &amp; Settings</div>
  <!-- settings.root, scrolled to Preferences. Appearance follows Preferences. -->
  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Preferences</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-sizing: border-box; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,0.08)"><span style="flex: 1 1 auto">Open on launch</span><span style="color: {{accent}}">Live</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-sizing: border-box; font-size: 17px"><span style="flex: 1 1 auto">Subtitles</span><span style="color: {{accent}}">Auto</span></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">Appearance</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column">
      <!-- settings.appearance.accent: a NavigationLink; the value is a 14 pt swatch and the name of the accent the environment holds. It pushes the accent choices, the list of iPhone-Settings-AppIcon with swatches. -->
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-sizing: border-box; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,0.08)"><span style="flex: 1 1 auto">Accent</span><span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; flex: 0 0 auto; display: inline-block"></span><span style="color: #A7B0BF">Blue ›</span></div>
      <!-- settings.appearance.icon: a NavigationLink to iPhone-Settings-AppIcon; the value is a 24 pt thumbnail and the name of the icon the Home Screen shows. -->
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-sizing: border-box; font-size: 17px"><span style="flex: 1 1 auto">App icon</span><svg width="24" height="24" viewBox="192 194 640 640" style="display: block; flex: 0 0 auto; border-radius: 6px; background: #0B0E13"><g fill="none" stroke="#F2F4F8" stroke-width="60" stroke-linecap="round"><path d="M397.1 313.6A150 150 0 0 0 397.1 506.4"/><path d="M626.9 313.6A150 150 0 0 1 626.9 506.4"/><path d="M305.2 236.4A270 270 0 0 0 305.2 583.6"/><path d="M718.8 236.4A270 270 0 0 1 718.8 583.6"/></g><circle cx="512" cy="410" r="56" fill="#F2F4F8"/><path d="M512 486V790" stroke="#F2F4F8" stroke-width="64" stroke-linecap="round"/></svg><span style="color: #A7B0BF">Mono ›</span></div>
    </div>
    <!-- settings.appearance.footer -->
    <div style="font-size: 13px; line-height: 1.4; color: #A7B0BF; padding: 0 4px 8px">The accent is for this profile on every device. The app icon is for this device only.</div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 0 4px">About</div>
    <div style="border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-sizing: border-box; font-size: 17px"><span style="flex: 1 1 auto">Version</span><span style="color: #A7B0BF">1.4 (52)</span></div></div>
  </div>
  <!-- The tab bar or the sheet's Close, whichever opens Settings, is not part of this board; the selected tab draws in the accent. -->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#4FD1C5","#FFB454","#F472B6","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
