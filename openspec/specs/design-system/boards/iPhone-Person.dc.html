<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone person page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

  <!-- person.root, pushed in the Movies tab from a cast name on a title page or a person in Search. person.back returns there. -->
  <div style="margin-top: 54px; height: 44px; display: flex; align-items: center; padding: 0 8px">
    <button type="button" style="font: inherit; font-size: 17px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: {{accent}}; display: flex; align-items: center; gap: 4px; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>The Long Harbor</span>
    </button>
  </div>
  <!-- person.header: TMDB profile photo in a circle, or initials on the logo placeholder when there is none; name; department and "<n> in your sources" -->
  <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px">
    <div style="width: 88px; height: 88px; border-radius: 44px; background: #26344A; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #A7B0BF">MH</div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <div style="font-size: 28px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px">Mira Holt</div>
      <div style="font-size: 13px; color: #A7B0BF">Acting · 9 in your sources</div>
    </div>
  </div>
  <!-- person.row.movies, person.row.series, person.row.directed (browse-by-person/a-person-s-page): only titles the user's sources have, newest release first, each row hidden when empty. A poster acts as any poster: it opens the title page. -->
  <!-- person.row.movies -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Movies</div>
      <div style="font-size: 13px; color: #A7B0BF">6 titles</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3A4A2F; flex: 0 0 auto"></div>
    </div>
  </div>
  <!-- person.row.series -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Series</div>
      <div style="font-size: 13px; color: #A7B0BF">3 titles</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #22304A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A2F3A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F3F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3A4A2F; flex: 0 0 auto"></div>
    </div>
  </div>
  <div style="flex: 1 1 auto"></div>
  <!-- person.credit: TMDB named under the rows, muted -->
  <div style="padding: 0 16px 12px; font-size: 12px; color: #A7B0BF">Filmography from TMDB</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
