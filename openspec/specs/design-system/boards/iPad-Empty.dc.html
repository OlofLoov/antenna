    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; font-weight: 600; color: #F2F4F8; background: rgba(255,255,255,0.12)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      <span>Series</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 17px; color: #F2F4F8">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>

    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 22px 12px 8px">Groups</div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>Favorites</span><span style="font-size: 14px; color: #A7B0BF">0</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 16px; color: #F2F4F8"><span>All channels</span><span style="font-size: 14px; color: #A7B0BF">0</span></div>
    <!-- browse.empty replaces the channel list (live-tv-on-iphone-ipad-mac/sources-that-fail-are-empty-or-wait-for-a-login) on the shared status layout: browse.settings, browse.retry -->
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; text-align: center">
      <!-- SF Symbol, 48, secondary -->
      <div style="color: #A7B0BF; margin-bottom: 8px"><svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M4 7a10 10 0 0 1 16 0"/><path d="M7.5 9.5a5.5 5.5 0 0 1 9 0"/><circle cx="12" cy="10" r="1.5"/><path d="M3 3l18 18"/></svg></div>
      <!-- browse.*.title, text style: title2 bold -->
      <div style="font-size: 22px; font-weight: 700">No channels yet</div>
      <!-- message, text style: body, secondary -->
      <div style="font-size: 17px; color: #A7B0BF; line-height: 1.35">Cabin M3U: waiting for its login to sync from iCloud</div>
      <!-- system bordered buttons, the first moves the user forward -->
      <div style="display: flex; gap: 16px; padding-top: 16px"><button type="button" style="font: inherit; font-size: 17px; font-weight: 600; height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.12); color: {{accent}}; cursor: pointer">Open Settings</button><button type="button" style="font: inherit; font-size: 17px; font-weight: 600; height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.12); color: {{accent}}; cursor: pointer">Try again</button></div>
    </div>
  </div>

  <!-- Player + now/next -->
  <div style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <!-- browse.player while the list shows a status: the ground color and nothing else, so the screen shows one state (design-system/empty-and-error-states-share-one-layout); browse.panel hidden -->
    <div style="width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #0B0E13; border: 1px solid rgba(255,255,255,0.08)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1194,"height":834}}'>

  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>

</html>
