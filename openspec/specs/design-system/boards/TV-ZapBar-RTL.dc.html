<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Apple TV zap bar, Arabic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div dir="rtl" style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1A2535; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- TV-ZapBar.dc.html in Arabic, ar_SA (design-system/layouts-mirror-in-right-to-left-languages, design-system/progress-runs-in-the-reading-direction, design-system/copy-fits-in-every-language). The channel identity is at the right, now and next in the middle with the bar filling from the right, and the badges at the left, aligned to the bar's left edge. The number entry pill moves to the top right. Up and down change channel as in English. Left and right go through MoveCommandDirection.reading, so they swap: right plays the previous channel and left opens Recents, and behind live right skips back and left skips forward. The LIVE badge reads مباشر with its red dot; the outlined quality badges are stream facts and stay Latin. Times are on the 12-hour clock ar_SA uses, in Arabic-Indic digits. The next line joins time and title with " · " in code (design.md, PR 11). No letter spacing. -->

  <!-- Live video stage -->
  <div style="position: absolute; inset: 0; background: #1A2535"></div>

  <!-- Composite for layout: the pill and the bar are never on screen together (tv-zap-bar-and-number-entry/typing-a-number-shows-the-match) and no clock is rendered in full-screen playback. The TV-ZapBar-*.dc.html state boards are authoritative for what is on screen. -->
  <!-- Channel number entry (top right, appears while typing digits) -->
  <div style="position: absolute; right: 80px; top: 44px; display: flex; align-items: center; gap: 18px; padding: 10px 22px; border-radius: 14px; background: rgba(8, 10, 14, 0.82)">
    <span style="font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; ">١٠<span style="color: #A7B0BF">_</span></span>
    <span style="font-size: 22px; color: #A7B0BF"><bdi>Sport Two</bdi></span>
  </div>

  <!-- Zap bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 236px; box-sizing: border-box; padding: 32px 80px 40px; background: rgba(8, 10, 14, 0.88); display: flex; align-items: center; gap: 40px">

    <!-- Channel identity, at the right -->
    <div style="display: flex; align-items: center; gap: 24px; width: 420px; flex: 0 0 auto">
      <div style="width: 132px; height: 88px; border-radius: 12px; background: #1E3A5F; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700">S1</div>
      <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <div style="font-size: 26px; color: #A7B0BF; font-variant-numeric: tabular-nums">١٠٤</div>
        <div style="font-size: 36px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><bdi>Sport One</bdi></div>
        <div style="font-size: 20px; color: #A7B0BF"><bdi>Sport</bdi> • ٤ من ٤٢</div>
      </div>
    </div>

    <!-- Now playing -->
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px">
        <div style="font-size: 34px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><bdi>Premier League: Arsenal v Liverpool</bdi></div>
        <div style="font-size: 24px; color: #A7B0BF; white-space: nowrap; font-variant-numeric: tabular-nums">٨:٠٠ م – ١٠:٠٠ م</div>
      </div>
      <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.16); position: relative">
        <!-- zapBar.progress, 78% filled from the right -->
        <div style="height: 6px; width: 78%; border-radius: 3px; background: {{accent}}"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px">
        <div style="display: flex; gap: 14px; align-items: baseline; min-width: 0">
          <span style="font-size: 18px; font-weight: 600; color: #A7B0BF">التالي</span>
          <span style="font-size: 24px; color: #D7DEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">١٠:٠٠ م · <bdi>Match of the Day</bdi></span>
        </div>
        <div style="font-size: 22px; color: #A7B0BF; white-space: nowrap">تبقّى ٢٦ د</div>
      </div>
    </div>

    <!-- Status badges, at the left; flex-end is the left edge in right-to-left -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px; flex: 0 0 auto">
      <div style="display: flex; gap: 10px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.12)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF5F57; display: inline-block"></span>مباشر</span>
        <span style="font-size: 18px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: 1.5px solid #A7B0BF; color: #D7DEE8"><bdi>1080p</bdi></span>
        <span style="font-size: 18px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: 1.5px solid #A7B0BF; color: #D7DEE8"><bdi>AAC 5.1</bdi></span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center; font-size: 20px; color: #A7B0BF">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        <span>إعادة المشاهدة: ٧ أيام</span>
        <span style="width: 4px; height: 4px; border-radius: 2px; background: #A7B0BF; display: inline-block"></span>
        <span>اضغط لتصفّح القنوات</span>
      </div>
      <!-- zapBar.tracksHint: names the hold that opens the info panel, under the browse or live hint, whether or not catch-up or the rewind row shows (tv-zap-bar-and-number-entry/the-info-bar-names-the-hold) -->
      <div style="display: flex; gap: 10px; align-items: center; font-size: 20px; color: #A7B0BF">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M7 10h4M13 10h4M7 13h6"/></svg>
        <span>اضغط مطولًا للمعلومات والصوت والترجمة</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
