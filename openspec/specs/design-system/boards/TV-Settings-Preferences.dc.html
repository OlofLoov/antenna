<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV settings, preferences</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- TV-Settings scrolled to Preferences, Subtitles focused. Each preference is a row with its label and value; selecting it opens TV-Settings-Preferences-Choices. -->
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <div style="position: absolute; left: 80px; right: 80px; top: 60px; bottom: 60px; display: flex; gap: 80px">

    <!-- settings.lead -->
    <div style="width: 560px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; text-align: center">
      <div style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 150px; line-height: 1; color: #A7B0BF">⚙</div>
      <div style="font-size: 48px; font-weight: 600">Sources &amp; Settings</div>
      <!-- settings.subtitles.footer: the focused Subtitles row's explanation, caption1 (25), secondary (sources-and-settings/choose-when-subtitles-show) -->
      <div style="font-size: 25px; color: #A7B0BF; line-height: 32px">Subtitles show when the sound is not in one of your languages.</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; font-size: 29px">
      <!-- settings.reminders -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Reminders</span><span style="color: #A7B0BF">›</span></div>
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">PREFERENCES</div>
      <!-- settings.openOnLaunch -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Open on launch</span><span style="color: #A7B0BF">Live ›</span></div>
      <!-- settings.guideWindow -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Guide window</span><span style="color: #A7B0BF">2 hours ›</span></div>
      <!-- settings.refreshSources -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Refresh sources</span><span style="color: #A7B0BF">Every 12 hours ›</span></div>
      <!-- settings.swipe -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Swipe up or down while watching</span><span style="color: #A7B0BF">Changes channel ›</span></div>
      <!-- settings.subtitles: focused, value dark secondary on the platter -->
      <div style="height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #F2F4F8; color: #0B0E13; border-radius: 20px; transform: scale(1.03); box-shadow: 0 12px 32px rgba(0,0,0,.45)"><span>Subtitles</span><span style="color: #4B5563">Auto ›</span></div>
      <div style="font-size: 25px; font-weight: 600; color: #6B7280; padding: 12px 20px 0; letter-spacing: 0.5px">ABOUT</div>
      <!-- settings.version -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>Version</span><span style="color: #A7B0BF">1.0 (4)</span></div>
      <!-- settings.ffmpegNotice -->
      <div style="height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 20px; background: rgba(255,255,255,0.08)"><span>FFmpeg</span><span style="color: #A7B0BF">›</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
