<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone title detail, missing metadata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- Missing-metadata state: no backdrop, no year, no plot, no cast, no trailer, no rating. Everything the provider did not send is left out. -->

  <!-- title.backdrop fallback: no backdropURL, so the poster sits centered on the placeholder color -->
  <div style="position: relative; width: 390px; height: 300px; background: #1E3A5F; flex: 0 0 auto; overflow: hidden">
    <!-- title.back over the art, 44 pt target -->
    <div style="position: absolute; left: 16px; top: 54px">
      <button type="button" aria-label="Back to Movies" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(8,10,14,0.6); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <!-- title.poster: 2:3, 140 by 210. With no poster either, the text tile is used. -->
    <div style="position: absolute; left: 125px; top: 60px; width: 140px; height: 210px; border-radius: 10px; background: #4A3A2F; box-shadow: 0 12px 32px rgba(0,0,0,0.45)"></div>
  </div>

  <!-- title.root copy -->
  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: {{accent}}">Movie · Action</div>
    <div style="font-size: 28px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px">Salt Road</div>
    <!-- title.meta: only the duration arrived -->
    <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #D7DEE8">
      <span>1 h 32 min</span>
    </div>
    <!-- title.noPlot: muted body text in place of the plot -->
    <div style="font-size: 15px; line-height: 1.45; color: #A7B0BF">No description from your provider.</div>
    <!-- title.play (Play, nothing in progress) and title.myList; no title.trailer because no URL arrived -->
    <div style="display: flex; gap: 8px; padding-top: 6px">
      <button type="button" style="font: inherit; font-size: 15px; font-weight: 700; height: 44px; flex: 1 1 auto; border-radius: 10px; border: 0; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
        <span>Play</span>
      </button>
      <button type="button" aria-label="Add to my list" style="font: inherit; width: 44px; height: 44px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.14); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1 1 auto"></div>

  <!-- Tab bar: the detail is pushed inside the Movies tab, so the bar stays -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
