        <div style="font-size: 18px; font-weight: 700">All movies</div>
        <div style="font-size: 13px; color: #A7B0BF">1 240 titles</div>
      </div>
      <div style="padding: 0 24px; display: grid; grid-template-columns: repeat(5, 132px); column-gap: 12px; row-gap: 16px">
