<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone movie player, track picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- movies.player: the movie full screen, letterboxed, still playing under the sheet. A tap on the picture shows and hides the controls (iPhone-Title-Player-Transport). -->
  <div style="position: absolute; left: 0; right: 0; top: 312px; height: 219px; background: #1A2535"></div>

  <!-- movies.player.close, top left, 44 pt circle on the 0.6 scrim -->
  <div style="position: absolute; left: 16px; top: 62px; width: 44px; height: 44px; border-radius: 22px; background: rgba(8,10,14,0.6); display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <!-- Top right capsule on the 0.6 scrim: player.tracks, then player.subtitles (filled while full subtitles are on). Both 44 pt and grayed to 0.4 when the title has nothing to choose. -->
  <div style="position: absolute; right: 16px; top: 62px; height: 44px; padding: 0 4px; border-radius: 22px; background: rgba(8,10,14,0.6); display: flex; align-items: center">
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span>
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h3M13 10h3M8 13h5"/></svg></span>
  </div>

  <!-- player.trackPicker as a sheet at compact width. Grabber, title 17, rows 44, radius 10. Dismiss by swipe down or Done. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 468px; border-radius: 16px 16px 0 0; background: #11151C; box-shadow: 0 -12px 40px rgba(0,0,0,.6); padding: 8px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3); margin: 0 auto 10px"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0 8px">
      <span style="font-size: 17px; font-weight: 600">Audio &amp; Subtitles</span>
      <!-- player.trackPicker.done -->
      <span style="font-size: 17px; font-weight: 600; color: {{accent}}; height: 44px; display: inline-flex; align-items: center">Done</span>
    </div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 6px 10px 6px">Audio</div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,0.12); font-size: 16px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span style="flex: 1 1 auto">English</span><span style="font-size: 13px; font-weight: 400; color: #A7B0BF">AAC 5.1</span></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 10px; font-size: 16px"><span style="width: 18px; height: 18px; display: inline-block"></span><span style="flex: 1 1 auto">English (audio description)</span><span style="font-size: 13px; color: #A7B0BF">AAC Stereo</span></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 10px; font-size: 16px"><span style="width: 18px; height: 18px; display: inline-block"></span><span style="flex: 1 1 auto">Español</span><span style="font-size: 13px; color: #A7B0BF">AAC Stereo</span></div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A7B0BF; padding: 14px 10px 6px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 6px">Subtitles</div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,0.12); font-size: 16px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span style="flex: 1 1 auto">Off</span></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 10px; font-size: 16px"><span style="width: 18px; height: 18px; display: inline-block"></span><span style="flex: 1 1 auto">English</span><span style="font-size: 13px; color: #A7B0BF">Forced</span></div>
    <!-- player.trackPicker.stream -->
    <div style="font-size: 12px; color: #A7B0BF; padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 6px">MP4 · H.264 1080p · AAC 5.1 · Apple player</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
