<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone movie player, track picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- clean-up-glass: controls over the art or the picture are glass alone, with no scrim fill, stroke or shadow of their own. -->
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- movies.player: the movie full screen, letterboxed, still playing under the sheet. A tap on the picture shows and hides the controls (iPhone-Title-Player-Transport). -->
  <div style="position: absolute; left: 0; right: 0; top: 312px; height: 219px; background: #1A2535"></div>

  <!-- movies.player.close, top left, 44 pt circle on the 0.6 scrim -->
  <div style="position: absolute; left: 16px; top: 62px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.16); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <!-- Top right glass circle: player.tracks alone, 44 pt. one-tracks-button: one button, captions.bubble, captions.bubble.fill while full subtitles are on, accessibility value "Subtitles On" or "Subtitles Off". Grayed to 0.4 only when the stream has one sound and no subtitles. It opens the system menu of audio, subtitles and the stream line. -->
  <div style="position: absolute; right: 16px; top: 62px; height: 44px; width: 44px; border-radius: 22px; background: rgba(255,255,255,0.16); backdrop-filter: blur(20px); display: flex; align-items: center">
    <span role="button" aria-label="Audio and Subtitles" aria-pressed="false" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M10.5 10a2 2 0 1 0 0 3M16.5 10a2 2 0 1 0 0 3"/></svg></span>
  </div>

  <!-- The tracks menu (one-tracks-button): the system pull-down menu from player.tracks, hanging below the glass circle, trailing edges aligned. No title, no Done, no grabber. Sections Audio, Subtitles and the stream lines, split by the system separators; the last section is disabled rows. With no subtitles in the stream the Subtitles section holds one disabled row, "No subtitles in this stream". Rows 44 pt or taller, 17 pt text, the sound format as a 15 pt muted second line. Picking a row closes the menu. System menu material alone, with no stroke of its own. -->
  <div role="menu" aria-label="Audio and Subtitles" style="position: absolute; right: 16px; top: 114px; width: 250px; border-radius: 22px; background: rgba(40,44,52,0.86); backdrop-filter: blur(30px); padding: 6px 0; box-sizing: border-box; display: flex; flex-direction: column; font-size: 17px; color: #F2F4F8; z-index: 2">
    <div style="font-size: 13px; line-height: 18px; color: rgba(235,235,245,0.6); padding: 8px 16px 4px 44px">Audio</div>
    <!-- Sound row, checked -->
    <div role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: #F2F4F8"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>English</span><span style="font-size: 15px; line-height: 20px; color: rgba(235,235,245,0.6)">AAC 5.1</span></span></div>
    <!-- Sound row -->
    <div role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: #F2F4F8"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>English (audio description)</span><span style="font-size: 15px; line-height: 20px; color: rgba(235,235,245,0.6)">AAC Stereo</span></span></div>
    <!-- Sound row -->
    <div role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: #F2F4F8"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>Español</span><span style="font-size: 15px; line-height: 20px; color: rgba(235,235,245,0.6)">AAC Stereo</span></span></div>
    <div role="separator" style="height: 1px; margin: 6px 0; background: rgba(255,255,255,0.12)"></div>
    <div style="font-size: 13px; line-height: 18px; color: rgba(235,235,245,0.6); padding: 8px 16px 4px 44px">Subtitles</div>
    <!-- Subtitles Off, checked -->
    <div role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: #F2F4F8"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>Off</span></span></div>
    <!-- Subtitle row -->
    <div role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: #F2F4F8"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>English</span><span style="font-size: 15px; line-height: 20px; color: rgba(235,235,245,0.6)">Forced</span></span></div>
    <div role="separator" style="height: 1px; margin: 6px 0; background: rgba(255,255,255,0.12)"></div>
    <!-- Stream line, disabled -->
    <div role="menuitem" aria-disabled="true" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 6px 16px; color: rgba(235,235,245,0.6)"><span style="width: 18px; flex: 0 0 auto; display: flex; justify-content: center"></span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 22px"><span>MP4 · H.264 1080p · AAC 5.1 · Apple player</span></span></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
