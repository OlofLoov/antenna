schema: spec-driven

context: |
  Antenna is a native IPTV player for iPhone, iPad, Mac and Apple TV. It plays
  the user's own sources (M3U, Xtream, later Stalker, Jellyfin and Channels DVR)
  and ships no content, no bundled playlists and no provider links.

  Who it is for:
  - Living-room viewer: watches live TV on Apple TV with the Siri Remote, mostly
    news and sport, hops channels, wants it to feel like cable, fast and
    predictable with no menus in the way.
  - Household setter-upper: has one or more IPTV subscriptions, sets up several
    Apple TVs and phones for the family, hates typing URLs and passwords with a
    remote and hates doing it twice.
  - Sports fan: wants several games at once, a quick way back to live after
    pausing, and catch-up when they miss the start.
  - On-the-go viewer: watches on iPhone, iPad or Mac, in bed, on a train, at a
    desk, and expects the same channels, favorites and progress as at home.
  - Movie and series watcher: uses the provider's on-demand library and wants it
    to feel like a streaming app, not a file list.

  Hard constraints every change keeps:
  - AntennaCore is a UI-free Swift package that imports Foundation only and tests with swift-testing under swift test. All parsing and protocol logic lives there. Apps depend on it, never the other way round, and SwiftData models stay in Apps.
  - Playback has two paths behind one PlaybackEngine protocol. HLS and containers the system can demux play through AVPlayer. Raw MPEG-TS plays through FFmpeg demux, VideoToolbox decode and AVSampleBufferVideoRenderer, so HDR10, Dolby Vision, Atmos and frame-rate matching keep working on Apple TV. EngineRouter picks by URL extension, defaults to the demuxer, and hands back to AVPlayer when the first bytes look like HLS. No software renderer such as mpv or VLCKit, no transcoding on device. FFmpeg stays LGPL-compatible, linked dynamically, with no GPL components.
  - Sync is SwiftData over the user's private CloudKit database (container iCloud.se.codecrave.antenna), with no server of our own. Every stored property is optional or defaulted, no unique attributes, relationships optional. The store enforces no uniqueness, so duplicates are resolved in code. A new kind of synced record or a schema migration is a decision recorded in its change's design.md.
  - Secrets live only in the synchronizable iCloud Keychain (generic password items under service se.codecrave.antenna.sources), never in SwiftData, logs, identifiers or labels. The one exception is a login drop for an Apple TV: sealed with HPKE to a key that exists only in that Apple TV's memory, it may sit in the user's private CloudKit database for at most ten minutes, in the record's encrypted values, and is deleted when the TV picks it up. A record keeps only a credentialKey. A source can arrive on a device before its credential, and the UI handles the missing credential.
  - Deployment target 26.0 on iOS, macOS and tvOS, with no availability checks below it. AntennaCore keeps a lower floor (iOS 17, macOS 14) only so swift test stays simple.
  - Paid unlock only, no free tier. The app is free to download and shows only the paywall until an entitlement is present. StoreKit 2 is the only source: one lifetime non-consumable and one yearly auto-renewing subscription, both with Family Sharing. A trial, if any, is the App Store introductory offer; the app has no trial logic. Every feature checks the same single "is entitled" state and no other gate exists. Entitlement state is cached locally for offline use, never stored in SwiftData, and receipts are never logged. A lapsed entitlement returns to the paywall and keeps sources, favorites and settings. The App Store description says a purchase is required.
  - Per-device state that is not a secret stays in UserDefaults.standard, outside SwiftData, CloudKit and NSUbiquitousKeyValueStore. Keys are namespaced by the owning screen (shell., recents.), values are small Codable structs stored as JSON, and a value that fails to decode reads as absent. Nothing stored there holds a secret or a stream link. Only the app touches UserDefaults.
  - Views compose. Components in Apps/Shared/Components/ take values and closures and never use SwiftData, the network or the Keychain. Screens in Apps/Shared/Views/, one per board, own the query, the model, navigation and loading, and provide shared state through one @Entry environment value. The shell is RootView, Apps/Mobile and Apps/TV. No Bool parameter picks a layout; a different arrangement is a differently named view. Composition uses @ViewBuilder closures, never AnyView. Current APIs only: @Observable, @Entry, .task. The swiftui-composition skill holds the rules.
  - Every SwiftUI #Preview is deterministic (fixture data, no network, no live clock, in-memory ModelContainer) and every component variant has one on each platform it ships on. CI renders every preview to a PNG and uploads them as a workflow artifact on each PR, for the reviewer to compare with the board. No reference images are committed and nothing fails on a visual change.
  - Strict concurrency is complete; warnings are fixed, not suppressed.

  Hard-to-reverse decisions are made in a change's design.md. Screens follow
  the design-system capability; its boards are in
  openspec/specs/design-system/boards/.

  All prose follows the repo's no-ai-slop rules (.claude/skills/no-ai-slop/SKILL.md):
  plain sentences, no em dashes, no puffery, American spelling.

rules:
  proposal:
    - Say in the Why who the change is for and what they can do afterwards, in the user's words.
    - List what is out of scope.
    - In Impact, name the changes or capabilities this depends on, and anything it is blocked on.
  specs:
    - Write requirements and scenarios a person can read without the code; no type names, file names or identifiers.
    - Give each requirement a short name that can become a stable test citation.
    - Cover what a user notices at the edges (offline, slow source, empty state, tvOS remote and focus) as scenarios.
  design:
    - For a screen, name the boards in openspec/specs/design-system/boards/ and the design-system requirements it follows, and say what is not drawn yet.
    - Record each hard-to-reverse decision with the options considered and why.
    - Settle identifiers, types and layout here, not in specs.
  tasks:
    - Group tasks so each group can ship as one small pull request.
    - End with a Verify group, with one task saying each requirement has a test citing <capability>/<requirement-slug> and one saying /opsx:verify passes.
