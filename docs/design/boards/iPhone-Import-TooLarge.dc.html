<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone import, file too large</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF;text-decoration:none}a:hover{color:#8ECDFF}
</style>
</helmet>
<!-- Import sheet when the picked file exceeds the 16 MB limit. The file was not read. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column; padding-top: 54px">
  <!-- Nav: import.cancel at the leading edge -->
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex: 0 0 auto">
    <span style="font-size: 17px; color: #5BB8FF; width: 60px">Cancel</span>
    <span style="font-size: 17px; font-weight: 600">Import a playlist</span>
    <span style="width: 60px"></span>
  </div>

  <!-- import.sheet -->
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; padding: 12px 16px 0; overflow: hidden">
    <!-- import.file: name and size of the picked file -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.06)">
      <span style="width: 44px; height: 44px; border-radius: 10px; background: #26344A; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D7DEE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">everything.m3u</span>
        <span style="font-size: 13px; color: #A7B0BF">41.7 MB</span>
      </div>
    </div>
    <!-- import.error -->
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
      <div style="font-size: 17px; font-weight: 600; line-height: 1.3; color: #FF5F57">This file is 41.7 MB. Antenna imports playlists up to 16 MB.</div>
      <div style="font-size: 15px; line-height: 1.45; color: #D7DEE8">Split the file, or host it and add the link as an M3U source instead.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 34px">
    <!-- import.import, disabled -->
    <div aria-disabled="true" style="font-size: 17px; font-weight: 700; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.1); color: #A7B0BF; display: flex; align-items: center; justify-content: center">Import</div>
    <!-- import.pickFile -->
    <div style="font-size: 17px; font-weight: 600; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.1); color: #F2F4F8; display: flex; align-items: center; justify-content: center">Choose another file</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
