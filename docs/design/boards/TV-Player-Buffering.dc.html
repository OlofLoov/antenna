<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV player, buffering</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1A2535; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- Live video stage: the last decoded frame stays while the engine buffers -->
  <div style="position: absolute; inset: 0; background: #1A2535"></div>

  <!-- player.buffering: 64 pt indeterminate ring, centred, shown after 500 ms of loading or buffering -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
    <svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5"/><circle cx="32" cy="32" r="28" fill="none" stroke="#F2F4F8" stroke-width="5" stroke-linecap="round" stroke-dasharray="44 132"/></svg>
    <!-- player.buffering.caption: appears after 10 s. "Reconnecting… attempt 2 of 3" uses the same position and style. -->
    <div style="font-size: 26px; color: #A7B0BF">Still buffering. Acme TV is sending data slowly.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
