<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV multi-view, two tiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- Two tiles side by side, just entered from the overlay. The new tile 2 has focus and audio. -->
  <!-- multiView.root: Ground behind the tiles; frames from MultiViewLayout with margin 24 and gap 16 -->
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0">
    <!-- multiView.tile.1 (muted) 24,279 928x522 -->
    <div style="position: absolute; left: 24px; top: 279px; width: 928px; height: 522px; border-radius: 14px; overflow: hidden; background: #1A2535">
      <!-- multiView.tile.1.label: number 22, name 26/600, multiView.tile.1.audio (off) 24 pt glyph; white card when the tile has focus -->
      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-radius: 12px; background: rgba(8, 10, 14, 0.88); color: #F2F4F8">
        <span style="font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums">101</span>
        <span style="font-size: 26px; font-weight: 600; white-space: nowrap">Eurosport 1</span>
        <span style="display: inline-flex; color: #A7B0BF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg></span>
      </div>
    </div>

    <!-- multiView.tile.2 (focused, audible) 968,279 928x522 -->
    <div style="position: absolute; left: 968px; top: 279px; width: 928px; height: 522px; border-radius: 14px; overflow: hidden; background: #1E2B3D; box-shadow: 0 0 0 5px #F2F4F8, 0 12px 32px rgba(0,0,0,0.45)">
      <!-- multiView.tile.2.label: number 22, name 26/600, multiView.tile.2.audio (on) 24 pt glyph; white card when the tile has focus -->
      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-radius: 12px; background: #F2F4F8; color: #0B0E13">
        <span style="font-size: 22px; color: #4B5563; font-variant-numeric: tabular-nums">104</span>
        <span style="font-size: 26px; font-weight: 600; white-space: nowrap">Sport One</span>
        <span style="display: inline-flex; color: #0B0E13"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></span>
      </div>
    </div>

  </div>

  <!-- multiView.hint: shown for 5 s after entering; 24 pt secondary, keys 24/600 primary, on the scrim; never focusable -->
  <div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; align-items: center; gap: 28px; height: 60px; padding: 0 28px; border-radius: 999px; background: rgba(8, 10, 14, 0.88); font-size: 24px; color: #D7DEE8; white-space: nowrap">
    <span><span style="font-weight: 600; color: #F2F4F8">Select</span> change channel</span>
    <span><span style="font-weight: 600; color: #F2F4F8">Hold select</span> options</span>
    <span><span style="font-weight: 600; color: #F2F4F8">Play/Pause</span> full screen</span>
    <span><span style="font-weight: 600; color: #F2F4F8">Menu</span> leave multi-view</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
