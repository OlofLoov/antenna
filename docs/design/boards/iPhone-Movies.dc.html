<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone movies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- Hero: portrait key art fills the top, copy sits over a solid scrim at its foot -->
  <div style="position: relative; width: 390px; height: 520px; background: #22304A; flex: 0 0 auto; overflow: hidden">
    <!-- top bar over the art: movies.kind segmented control (Movies | Series) and the search button -->
    <div style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
      <div role="tablist" aria-label="Kind" style="display: flex; gap: 2px; height: 44px; padding: 4px; border-radius: 22px; background: rgba(8,10,14,0.6); box-sizing: border-box">
        <span role="tab" aria-selected="true" style="display: flex; align-items: center; font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 18px; background: #F2F4F8; color: #0B0E13">Movies</span>
        <span role="tab" aria-selected="false" style="display: flex; align-items: center; font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 18px; color: #F2F4F8">Series</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Search" style="font: inherit; width: 36px; height: 36px; border-radius: 18px; border: 0; background: rgba(8,10,14,0.6); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </div>
    </div>
    <!-- genre chips -->
    <div style="position: absolute; left: 0; right: 0; top: 108px; display: flex; gap: 8px; padding: 0 16px; overflow: hidden; white-space: nowrap">
      <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 15px; background: #F2F4F8; color: #0B0E13; flex: 0 0 auto">All</span>
      <span style="font-size: 13px; padding: 6px 12px; border-radius: 15px; background: rgba(8,10,14,0.6); color: #F2F4F8; flex: 0 0 auto">Action</span>
      <span style="font-size: 13px; padding: 6px 12px; border-radius: 15px; background: rgba(8,10,14,0.6); color: #F2F4F8; flex: 0 0 auto">Comedy</span>
      <span style="font-size: 13px; padding: 6px 12px; border-radius: 15px; background: rgba(8,10,14,0.6); color: #F2F4F8; flex: 0 0 auto">Drama</span>
      <span style="font-size: 13px; padding: 6px 12px; border-radius: 15px; background: rgba(8,10,14,0.6); color: #F2F4F8; flex: 0 0 auto">Thriller</span>
      <span style="font-size: 13px; padding: 6px 12px; border-radius: 15px; background: rgba(8,10,14,0.6); color: #F2F4F8; flex: 0 0 auto">Family</span>
    </div>
    <!-- copy -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px 16px; background: rgba(11,14,19,0.78); display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: {{accent}}">Recently added · Thriller</div>
      <div style="font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px">The Long Harbor</div>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #D7DEE8">
        <span>2024</span><span style="width: 3px; height: 3px; border-radius: 2px; background: #A7B0BF; display: inline-block"></span><span>2 h 08 min</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 4px; border: 1.5px solid #A7B0BF">4K</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 4px; border: 1.5px solid #A7B0BF">15</span>
      </div>
      <div style="display: flex; gap: 8px; padding-top: 6px">
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 700; height: 44px; flex: 1 1 auto; border-radius: 10px; border: 0; background: #F2F4F8; color: #0B0E13; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span>Play</span>
        </button>
        <button type="button" style="font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.14); color: #F2F4F8; cursor: pointer">Info</button>
        <button type="button" aria-label="Add to my list" style="font: inherit; width: 44px; height: 44px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.14); color: #F2F4F8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Continue watching (the series card carries the SERIES badge, movies.card.<id>.badge) -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Continue watching</div>
      <div style="font-size: 13px; color: #A7B0BF">See all</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 168px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px">
        <div style="width: 168px; height: 94px; border-radius: 8px; background: #3B2F4A; position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.22)"><div style="height: 3px; width: 42%; background: {{accent}}"></div></div>
        </div>
        <div style="font-size: 13px; color: #D7DEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Second Act · 52 min left</div>
      </div>
      <div style="width: 168px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px">
        <div style="width: 168px; height: 94px; border-radius: 8px; background: #2F4A3B; position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.22)"><div style="height: 3px; width: 78%; background: {{accent}}"></div></div>
          <div style="position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 5px; border-radius: 4px; border: 1.5px solid #A7B0BF; background: rgba(8,10,14,0.72)">SERIES</div>
        </div>
        <div style="font-size: 13px; color: #D7DEE8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northern Lights · S2 E4</div>
      </div>
      <div style="width: 168px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px">
        <div style="width: 168px; height: 94px; border-radius: 8px; background: #4A3A2F; position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.22)"><div style="height: 3px; width: 15%; background: {{accent}}"></div></div>
        </div>
        <div style="font-size: 13px; color: #D7DEE8">Salt Road</div>
      </div>
    </div>
  </div>

  <!-- Recently added (posters, cut by the tab bar to signal scroll) -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; flex: 1 1 auto; min-height: 0; overflow: hidden">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 17px; font-weight: 700">Recently added</div>
      <div style="font-size: 13px; color: #A7B0BF">214 titles</div>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #3B2F4A; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #2F4A3B; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #4A3A2F; flex: 0 0 auto"></div>
      <div style="width: 110px; height: 165px; border-radius: 8px; background: #334155; flex: 0 0 auto"></div>
    </div>
  </div>

  <!-- Tab bar -->
  <div style="height: 84px; flex: 0 0 auto; box-sizing: border-box; padding: 8px 8px 24px; border-top: 1px solid rgba(255,255,255,0.08); background: #11151C; display: flex; justify-content: space-around; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      <span>Live</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>
      <span>Guide</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: {{accent}}; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10.5 12.5v4l3.5-2z" fill="currentColor"/></svg>
      <span>Movies</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #A7B0BF; width: 64px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
