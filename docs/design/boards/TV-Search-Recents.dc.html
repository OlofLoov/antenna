    <!-- search.recents -->
    <div style="width: 880px; display: flex; flex-direction: column; gap: 10px">
      <!-- search.recent.0 -->
      <div style="display: flex; align-items: center; gap: 20px; height: 64px; padding: 0 24px; border-radius: 14px; background: rgba(255,255,255,0.06); box-sizing: border-box">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
