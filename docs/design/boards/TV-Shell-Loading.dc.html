<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV shell, loading at launch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; align-items: center; justify-content: center">

  <!-- shell.player: ground colour until the first source finishes. No tab bar, no clock. -->

  <!-- shell.loading: one row per source, name 26 pt, muted detail 22 pt (DR-15) -->
  <div style="width: 1000px; border-radius: 20px; background: rgba(255,255,255,0.06); box-sizing: border-box; padding: 16px 32px; display: flex; flex-direction: column">

    <!-- shell.loading.<sourceId>: still loading, indeterminate indicator -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px; border-bottom: 1px solid rgba(255,255,255,0.08)">
      <span style="width: 44px; height: 44px; border-radius: 22px; border: 4px solid rgba(255,255,255,0.18); border-top-color: {{accent}}; box-sizing: border-box; flex: 0 0 auto"></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Home provider</div>
        <div style="font-size: 22px; color: #A7B0BF">Loading channels</div>
      </div>
    </div>

    <!-- shell.loading.<sourceId>: finished with no channels, so the shell keeps waiting for the other source -->
    <div style="display: flex; align-items: center; gap: 24px; height: 96px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 26px">Cabin</div>
        <div style="font-size: 22px; color: #A7B0BF">0 channels</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
