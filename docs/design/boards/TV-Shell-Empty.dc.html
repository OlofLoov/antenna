<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV shell, no channels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; align-items: center; justify-content: center">

  <!-- shell.player: ground colour, nothing to tune. No tab bar, no clock; Menu still shows the bar. -->

  <!-- shell.empty: 29 pt title, 24 pt muted line per source whose login has not synced -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 1200px">
    <div style="font-size: 29px; font-weight: 700">No channels yet</div>
    <div style="font-size: 24px; color: #A7B0BF">Home provider: waiting for its login to sync from iCloud</div>
    <div style="font-size: 24px; color: #A7B0BF">Cabin: waiting for its login to sync from iCloud</div>

    <!-- shell.retry: the only focusable element, so it carries the Focus token (DR-2) -->
    <button type="button" style="font: inherit; font-size: 26px; font-weight: 700; margin-top: 26px; padding: 18px 44px; border-radius: 14px; border: 0; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,0.45); cursor: pointer">Retry</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
