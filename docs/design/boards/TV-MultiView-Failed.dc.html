<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box">

  <!-- multiView.root: Ground behind the tiles; frames from MultiViewLayout with margin 24 and gap 16 -->
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0">
    <!-- multiView.tile.1 (muted, buffering) 49,25 903x507 -->
    <div style="position: absolute; left: 49px; top: 25px; width: 903px; height: 507px; border-radius: 14px; overflow: hidden; background: #1A2535">
      <!-- multiView.tile.1.buffering: 44 pt ring centred over the last frame, no caption -->
      <div style="position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 22px; border: 4px solid rgba(255,255,255,0.18); border-top-color: #F2F4F8; box-sizing: border-box"></div>

      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-radius: 12px; background: rgba(8, 10, 14, 0.88); color: #F2F4F8">
        <span style="font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums">101</span>
        <span style="font-size: 26px; font-weight: 600; white-space: nowrap">Eurosport 1</span>
        <span style="display: inline-flex; color: #A7B0BF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg></span>
      </div>
    </div>

    <!-- multiView.tile.2 (muted) 968,25 903x507 -->
    <div style="position: absolute; left: 968px; top: 25px; width: 903px; height: 507px; border-radius: 14px; overflow: hidden; background: #1E2B3D">
      <!-- multiView.tile.2.label: number 22, name 26/600, multiView.tile.2.audio (off) 24 pt glyph; white card when the tile has focus -->
      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-radius: 12px; background: rgba(8, 10, 14, 0.88); color: #F2F4F8">
        <span style="font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums">104</span>
        <span style="font-size: 26px; font-weight: 600; white-space: nowrap">Sport One</span>
        <span style="display: inline-flex; color: #A7B0BF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg></span>
      </div>
    </div>

    <!-- multiView.tile.3 (focused, muted, failed) 508,548 903x507 -->
    <div style="position: absolute; left: 508px; top: 548px; width: 903px; height: 507px; border-radius: 14px; overflow: hidden; background: #0B0E13; box-shadow: 0 0 0 5px #F2F4F8, 0 12px 32px rgba(0,0,0,0.45)">
      <!-- multiView.tile.3.failed: glyph 44 muted, multiView.tile.3.failed.title 29/600, multiView.tile.3.failed.body 22 secondary, hint 18 muted -->
      <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 64px; text-align: center">
        <span style="display: inline-flex; color: #A7B0BF"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg></span>
        <div style="font-size: 29px; font-weight: 600">Your provider refused another stream</div>
        <div style="font-size: 22px; line-height: 1.4; color: #D7DEE8">Many providers allow one or two streams per account at a time.</div>
        <div style="font-size: 18px; color: #A7B0BF">Hold select for options</div>
      </div>
      <!-- multiView.tile.3.label: number 22, name 26/600, multiView.tile.3.audio (off) 24 pt glyph; white card when the tile has focus -->
      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px; border-radius: 12px; background: #F2F4F8; color: #0B0E13">

    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>

  renderVals() {

}
</script>
