<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple TV guide grid, empty group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5BB8FF}a:hover{color:#8ECDFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0E13; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; color: #F2F4F8; box-sizing: border-box; display: flex; flex-direction: column">

  <!-- Top: PiP keeps playing (AC-19). No block has focus, so the panel shows only the clock. -->
  <div style="display: flex; gap: 40px; padding: 48px 64px 28px; align-items: flex-start">
    <!-- guide.pip, engine playing -->
    <div style="width: 480px; height: 270px; border-radius: 14px; background: #1A2535; flex: 0 0 auto; position: relative; overflow: hidden">
      <div style="position: absolute; left: 16px; bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 18px; color: #D7DEE8">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #FF5F57; display: inline-block"></span>
        <span>104 Sport One</span>
      </div>
    </div>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 6px">
      <div style="display: flex; justify-content: flex-end; align-items: baseline; gap: 24px">
        <!-- guide.clock -->
        <div style="font-size: 34px; font-weight: 600; letter-spacing: 0.5px">21:34</div>
      </div>
    </div>
  </div>

  <!-- Grid: header and now line stay, no rows -->
  <div style="flex: 1 1 auto; position: relative; padding: 0 64px 40px; display: flex; flex-direction: column; gap: 6px">

    <!-- Time header. guide.day.0 focused: Focus token (DR-2), weight 600, radius 8. -->
    <div style="display: flex; align-items: center; height: 52px">
      <div style="width: 300px; flex: 0 0 auto; display: flex; gap: 10px; align-items: center">
        <span style="font-size: 20px; font-weight: 600; padding: 6px 14px; border-radius: 8px; background: #F2F4F8; color: #0B0E13; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">Today</span>
        <span style="font-size: 20px; color: #A7B0BF; padding: 6px 14px">Tue</span>
        <span style="font-size: 20px; color: #A7B0BF; padding: 6px 14px">Wed</span>
      </div>
      <div style="width: 370px; font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.12)">20:00</div>
      <div style="width: 370px; font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.12)">20:30</div>
      <div style="width: 370px; font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.12)">21:00</div>
      <div style="width: 370px; font-size: 22px; color: #A7B0BF; font-variant-numeric: tabular-nums; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.12)">21:30</div>
    </div>

    <!-- guide.empty: muted 24 pt, centred in the grid area -->
    <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #A7B0BF">No channels in Favorites</div>

    <!-- Now line (21:34 → 94 min past 20:00 at 12.33 px/min) -->
    <div style="position: absolute; left: 1523px; top: 0; bottom: 40px; width: 3px; background: {{accent}}; border-radius: 2px"></div>
    <div style="position: absolute; left: 1489px; top: 8px; padding: 4px 10px; border-radius: 6px; background: {{accent}}; color: #0B0E13; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">21:34</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BB8FF","options":["#5BB8FF","#FFB454","#4FD1C5","#C084FC"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5BB8FF' };
  }
}
</script>
</body>
</html>
