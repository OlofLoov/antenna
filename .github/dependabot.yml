version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /Packages/AntennaCore
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      include: scope
