name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bash scripts/lint-commit.sh -
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mapfile -t shas < <(git rev-list "$BASE".."$HEAD")
          for sha in "${shas[@]}"; do
            git log -1 --format=%B "$sha" | bash scripts/lint-commit.sh - || { echo "in commit $sha"; exit 1; }
          done

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    env:
      OPENSPEC_VERSION: v1.16.0
      OPENSPEC_SHA256: f27fb2ff5c6c4aafb207cb0b797189215adb3a1150d4b4600a2d6a0b6e192ae1
      OPENSPEC_TELEMETRY: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSpec
        run: |
          gh release download "$OPENSPEC_VERSION" --repo Fission-AI/OpenSpec --pattern openspec-linux-x64.tar.gz --dir "$RUNNER_TEMP"
          echo "$OPENSPEC_SHA256  $RUNNER_TEMP/openspec-linux-x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openspec-linux-x64.tar.gz" -C "$RUNNER_TEMP" openspec
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate specs and changes
        run: openspec validate --all --strict --no-interactive
      - name: Tests cite existing requirements
        run: bash scripts/check-spec-refs.sh

  core:
    name: AntennaCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test --package-path Packages/AntennaCore
      - name: Test the FFmpeg path
        run: swift test --no-parallel --package-path Packages/AntennaDemux

  apps:
    name: Build apps
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v7
      # The image's default Xcode is the only one guaranteed to have its
      # simulator runtimes installed. Pinning an older Xcode (26.1) left the
      # iOS build with no simulator destination at all.
      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl list runtimes available
      - name: Ensure simulator runtimes
        run: |
          set -e
          for platform in iOS tvOS; do
            if ! xcrun simctl list runtimes available | grep -q "^$platform "; then
              echo "No $platform simulator runtime installed, downloading"
              xcodebuild -downloadPlatform "$platform"
            fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme Antenna \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build tvOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme AntennaTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  snapshots:
    name: Preview snapshots
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v7
      - name: Ensure iOS simulator runtime
        run: |
          set -e
          if ! xcrun simctl list runtimes available | grep -q "^iOS "; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Render previews
        run: |
          set -e
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "Simulator: $name"
          TEST_RUNNER_SNAPSHOTS_EXPORT_DIR="$PWD/snapshot-images" \
          xcodebuild test -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,name=$name" \
            -only-testing:AntennaTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-snapshots
          path: snapshot-images
          if-no-files-found: warn

  uitests:
    name: UI tests
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v7
      - name: Ensure iOS simulator runtime
        run: |
          set -e
          if ! xcrun simctl list runtimes available | grep -q "^iOS "; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run UI tests
        run: |
          set -e
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "Simulator: $name"
          xcodebuild test -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,name=$name" \
            -only-testing:AntennaUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Run iPad UI tests
        run: |
          set -e
          device=$(xcrun simctl list devices available | grep -E 'iPad Pro 13' | head -1)
          [ -n "$device" ] || device=$(xcrun simctl list devices available | grep -E 'iPad ' | head -1)
          id=$(echo "$device" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Simulator: $device"
          xcodebuild test -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,id=$id" \
            -only-testing:AntennaUITests/LiveRegularUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath ipad-ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-xcresult
          path: |
            ui-tests.xcresult
            ipad-ui-tests.xcresult
          if-no-files-found: ignore

  tvtests:
    name: tvOS tests
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v7
      - name: Ensure tvOS simulator runtime
        run: |
          set -e
          if ! xcrun simctl list runtimes available | grep -q "^tvOS "; then
            xcodebuild -downloadPlatform tvOS
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run tvOS tests
        run: |
          set -e
          line=$(xcrun simctl list devices available | grep -E '^ +Apple TV' | head -1)
          echo "Simulator: $line"
          id=$(printf '%s\n' "$line" | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          xcodebuild test -project Antenna.xcodeproj -scheme AntennaTV \
            -destination "platform=tvOS Simulator,id=$id" \
            -only-testing:AntennaTVTests \
            -resultBundlePath tv-tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
          xcodebuild test -project Antenna.xcodeproj -scheme AntennaTV \
            -destination "platform=tvOS Simulator,id=$id" \
            -only-testing:AntennaTVUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath tv-ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tv-tests-xcresult
          path: |
            tv-tests.xcresult
            tv-ui-tests.xcresult
          if-no-files-found: ignore
