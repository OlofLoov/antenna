name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bash scripts/lint-commit.sh -
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mapfile -t shas < <(git rev-list "$BASE".."$HEAD")
          for sha in "${shas[@]}"; do
            git log -1 --format=%B "$sha" | bash scripts/lint-commit.sh - || { echo "in commit $sha"; exit 1; }
          done

  specs:
    name: Spec status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Status matches tests
        run: bash scripts/check-specs.sh
      - name: Spec structure
        run: bash scripts/lint-spec.sh

  core:
    name: AntennaCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test --package-path Packages/AntennaCore

  apps:
    name: Build apps
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v5
      # The image's default Xcode is the only one guaranteed to have its
      # simulator runtimes installed. Pinning an older Xcode (26.1) left the
      # iOS build with no simulator destination at all.
      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl list runtimes available
      - name: Ensure simulator runtimes
        run: |
          set -e
          for platform in iOS tvOS; do
            if ! xcrun simctl list runtimes available | grep -q "^$platform "; then
              echo "No $platform simulator runtime installed, downloading"
              xcodebuild -downloadPlatform "$platform"
            fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme Antenna \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build tvOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme AntennaTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
