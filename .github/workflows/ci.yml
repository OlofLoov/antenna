name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bash scripts/lint-commit.sh -
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mapfile -t shas < <(git rev-list "$BASE".."$HEAD")
          for sha in "${shas[@]}"; do
            git log -1 --format=%B "$sha" | bash scripts/lint-commit.sh - || { echo "in commit $sha"; exit 1; }
          done

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    env:
      OPENSPEC_VERSION: v1.16.0
      OPENSPEC_SHA256: f27fb2ff5c6c4aafb207cb0b797189215adb3a1150d4b4600a2d6a0b6e192ae1
      OPENSPEC_TELEMETRY: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSpec
        run: |
          gh release download "$OPENSPEC_VERSION" --repo Fission-AI/OpenSpec --pattern openspec-linux-x64.tar.gz --dir "$RUNNER_TEMP"
          echo "$OPENSPEC_SHA256  $RUNNER_TEMP/openspec-linux-x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openspec-linux-x64.tar.gz" -C "$RUNNER_TEMP" openspec
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate specs and changes
        run: openspec validate --all --strict --no-interactive
      - name: Tests cite existing requirements
        run: bash scripts/check-spec-refs.sh

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: Web/site/.nvmrc
          cache: npm
          cache-dependency-path: Web/site/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Link, route and policy check
        run: npm test
      - name: Script size per page
        run: node scripts/check-site.js

  core:
    name: AntennaCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test with the Mac in German
        run: bash scripts/test-core-in-language.sh de-DE de_DE
      - name: Test the FFmpeg path
        run: swift test --no-parallel --package-path Packages/AntennaDemux

  apps:
    name: Build apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The image's default Xcode is the only one guaranteed to have its
      # simulator runtimes installed. Pinning an older Xcode (26.1) left the
      # iOS build with no simulator destination at all.
      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl list runtimes available
      - name: Ensure simulator runtimes
        run: |
          set -e
          for platform in iOS tvOS; do
            if ! xcrun simctl list runtimes available | grep -q "^$platform "; then
              echo "No $platform simulator runtime installed, downloading"
              xcodebuild -downloadPlatform "$platform"
            fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme Antenna \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build tvOS
        run: |
          xcodebuild build -project Antenna.xcodeproj -scheme AntennaTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Catalogs hold every string in code
        run: bash scripts/sync-strings.sh --check

  snapshots:
    name: Preview snapshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Ensure iOS simulator runtime
        run: |
          set -e
          if ! xcrun simctl list runtimes available | grep -q "^iOS "; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Render previews
        run: |
          set -e
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "Simulator: $name"
          TEST_RUNNER_SNAPSHOTS_EXPORT_DIR="$PWD/snapshot-images" \
          xcodebuild test -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,name=$name" \
            -only-testing:AntennaTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-snapshots
          path: snapshot-images
          if-no-files-found: warn
