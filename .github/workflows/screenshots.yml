name: App screenshots

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      languages:
        description: App languages for the store set, such as "de ar". Empty takes English and the reviewed languages.
        required: false
        default: ""
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: App screenshots
    runs-on: macos-26
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'screenshots')
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || '' }}
      - uses: ./.github/actions/simulator
        with:
          platform: iOS
      - name: Ensure tvOS simulator runtime
        run: |
          set -e
          if ! xcrun simctl list runtimes available | grep -q "^tvOS "; then
            xcodebuild -downloadPlatform tvOS
          fi
      - name: Pick and boot simulators
        id: devices
        run: |
          set -e
          pick() {
            xcrun simctl list devices available | grep -E "$1" | head -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}'
          }
          iphone=$(pick '^ +iPhone [0-9]+ Pro Max \(')
          ipad=$(pick '^ +iPad Pro 13')
          tv=$(pick '^ +Apple TV 4K')
          for id in "$iphone" "$ipad"; do
            xcrun simctl boot "$id"
            xcrun simctl bootstatus "$id"
            xcrun simctl status_bar "$id" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          done
          xcrun simctl list devices | grep -E "$iphone|$ipad|$tv"
          {
            echo "iphone=$iphone"
            echo "ipad=$ipad"
            echo "tv=$tv"
          } >> "$GITHUB_OUTPUT"
      - name: Store languages
        env:
          LANGUAGES: ${{ github.event.inputs.languages }}
        run: |
          set -e
          read -r -a codes <<< "${LANGUAGES:-}"
          python3 scripts/store_metadata.py locales "${codes[@]}" > store-languages.txt
          cat store-languages.txt
      - name: Build for iPhone and iPad
        env:
          IPHONE: ${{ steps.devices.outputs.iphone }}
        run: |
          xcodebuild build-for-testing -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,id=$IPHONE" \
            -derivedDataPath dd-ios CODE_SIGNING_ALLOWED=NO
      - name: iPhone and iPad walk-throughs
        env:
          IPHONE: ${{ steps.devices.outputs.iphone }}
          IPAD: ${{ steps.devices.outputs.ipad }}
        run: |
          xcodebuild test-without-building -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,id=$IPHONE" \
            -destination "platform=iOS Simulator,id=$IPAD" \
            -only-testing:AntennaJourneys \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath dd-ios -resultBundlePath ios-journeys.xcresult
      - name: iPhone and iPad store sets
        if: success() || failure()
        env:
          IPHONE: ${{ steps.devices.outputs.iphone }}
          IPAD: ${{ steps.devices.outputs.ipad }}
        run: |
          failed=0
          while read -r code region _ <&3; do
            [ "$code" = "en" ] && continue
            TEST_RUNNER_STORE_LANGUAGE="$code" TEST_RUNNER_STORE_REGION="$region" \
              xcodebuild test-without-building -project Antenna.xcodeproj -scheme Antenna \
              -destination "platform=iOS Simulator,id=$IPHONE" \
              -destination "platform=iOS Simulator,id=$IPAD" \
              -only-testing:AntennaJourneys/AppJourneys/testStore \
              -retry-tests-on-failure -test-iterations 2 \
              -derivedDataPath dd-ios -resultBundlePath "store-ios-$code.xcresult" || failed=1
          done 3< store-languages.txt
          exit "$failed"
      - name: Build for Apple TV
        if: success() || failure()
        env:
          TV: ${{ steps.devices.outputs.tv }}
        run: |
          xcodebuild build-for-testing -project Antenna.xcodeproj -scheme AntennaTV \
            -destination "platform=tvOS Simulator,id=$TV" \
            -derivedDataPath dd-tv CODE_SIGNING_ALLOWED=NO
      - name: Apple TV walk-throughs
        if: success() || failure()
        env:
          TV: ${{ steps.devices.outputs.tv }}
        run: |
          xcodebuild test-without-building -project Antenna.xcodeproj -scheme AntennaTV \
            -destination "platform=tvOS Simulator,id=$TV" \
            -only-testing:AntennaTVJourneys \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath dd-tv -resultBundlePath tv-journeys.xcresult
      - name: Apple TV store sets
        if: success() || failure()
        env:
          TV: ${{ steps.devices.outputs.tv }}
        run: |
          failed=0
          while read -r code region _ <&3; do
            [ "$code" = "en" ] && continue
            TEST_RUNNER_STORE_LANGUAGE="$code" TEST_RUNNER_STORE_REGION="$region" \
              xcodebuild test-without-building -project Antenna.xcodeproj -scheme AntennaTV \
              -destination "platform=tvOS Simulator,id=$TV" \
              -only-testing:AntennaTVJourneys/TVJourneys/testStore \
              -retry-tests-on-failure -test-iterations 2 \
              -derivedDataPath dd-tv -resultBundlePath "store-tv-$code.xcresult" || failed=1
          done 3< store-languages.txt
          exit "$failed"
      - name: Export screenshots
        if: always()
        run: |
          set -e
          bundles=()
          for bundle in ios-journeys.xcresult tv-journeys.xcresult; do
            [ -d "$bundle" ] && bundles+=("$bundle")
          done
          [ "${#bundles[@]}" -gt 0 ] || exit 0
          bash scripts/export-screenshots.sh app-screenshots "${bundles[@]}"
          [ -f store-languages.txt ] || exit 0
          while read -r code _ stores <&3; do
            if [ "$code" = "en" ]; then
              set -- "${bundles[@]}"
            else
              set --
              for bundle in "store-ios-$code.xcresult" "store-tv-$code.xcresult"; do
                [ -d "$bundle" ] && set -- "$@" "$bundle"
              done
            fi
            if [ "$#" -gt 0 ]; then
              bash scripts/export-screenshots.sh --store "$stores" store-screenshots "$@"
            fi
          done 3< store-languages.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: app-screenshots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload store screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots
          path: store-screenshots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots-xcresult
          path: "*.xcresult"
          if-no-files-found: ignore
