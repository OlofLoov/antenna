name: UI tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    name: iPhone stall ${{ matrix.n }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/simulator
        with:
          platform: iOS
      - name: Run landscape tests with a stall sampler
        run: |
          set +e
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          mkdir -p diag
          (
            n=0
            while true; do
              sleep 20
              if [ -f run.log ] && [ "$(grep -c 'notification not received' run.log)" -gt "$n" ]; then
                n=$(grep -c 'notification not received' run.log)
                pid=$(pgrep -f 'Antenna.app/Antenna' | head -1)
                echo "stall $n pid $pid" >> diag/stalls.txt
                [ -n "$pid" ] && sample "$pid" 5 -file "diag/sample-$n.txt" >/dev/null 2>&1
                [ -n "$pid" ] && ps -o pid,pcpu,rss,command -p "$pid" >> diag/stalls.txt
                xcrun simctl spawn booted log show --last 3m --style compact --predicate 'process == "Antenna" OR process == "backboardd" OR process == "SpringBoard"' > "diag/log-$n.txt" 2>&1
                xcrun simctl io booted screenshot "diag/shot-$n.png" >/dev/null 2>&1
              fi
            done
          ) &
          watcher=$!
          xcodebuild test -project Antenna.xcodeproj -scheme Antenna \
            -destination "platform=iOS Simulator,name=$name" \
            -only-testing:AntennaUITests/LivePlayerUITests \
            -only-testing:AntennaUITests/PlayerExtrasUITests \
            -test-iterations 8 \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee run.log | grep -E "Test Case.*(passed|failed)|notification not received|Restarting"
          kill $watcher
          cp run.log diag/
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iphone-stall-${{ matrix.n }}
          path: |
            diag
            ui-tests.xcresult
          if-no-files-found: ignore
