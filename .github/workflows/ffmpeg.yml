name: FFmpeg

on:
  pull_request:
    paths:
      - scripts/build-ffmpeg.sh
      - scripts/ffmpeg-smoke.swift
      - .github/workflows/ffmpeg.yml
  push:
    tags: ['ffmpeg-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build FFmpeg.xcframework
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build
        run: scripts/build-ffmpeg.sh
      - name: Smoke test
        run: |
          set -e
          frameworks="$PWD/.build/ffmpeg/frameworks/macos"
          swiftc -target arm64-apple-macos26.0 -F "$frameworks" -framework FFmpeg \
            -Xlinker -rpath -Xlinker "$frameworks" scripts/ffmpeg-smoke.swift -o .build/ffmpeg/smoke
          .build/ffmpeg/smoke Packages/AntennaCore/Sources/AntennaTestSupport/Fixtures
      - name: Package
        run: |
          set -e
          cd .build/ffmpeg
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent FFmpeg.xcframework dist/FFmpeg.xcframework.zip
          cp ffmpeg-*.tar.xz dist/
          cp ../../scripts/build-ffmpeg.sh dist/
          checksum=$(swift package compute-checksum dist/FFmpeg.xcframework.zip)
          echo "$checksum" > dist/FFmpeg.xcframework.zip.checksum
          {
            echo "### FFmpeg.xcframework"
            echo
            echo "Checksum: \`$checksum\`"
            echo
            echo '```'
            du -sh FFmpeg.xcframework/*/FFmpeg.framework
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-xcframework
          path: .build/ffmpeg/dist
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/ffmpeg-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-xcframework
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          checksum=$(cat dist/FFmpeg.xcframework.zip.checksum)
          notes="LGPL 2.1 build of FFmpeg for Antenna, made by build-ffmpeg.sh (attached) from the attached FFmpeg source. Swift package checksum: $checksum"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
